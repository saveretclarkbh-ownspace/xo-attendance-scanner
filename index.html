<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>XO+ Attendance</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {

      font-family: Arial, sans-serif;

      text-align: center;

      padding: 20px;

      background: #f5f5f5;

    }


    h1 {

      margin-bottom: 5px;

      font-size: 32px;

    }


    p {

      font-size: 20px;

    }


    #reader {

      max-width: 500px;

      margin: 20px auto;

      background: white;

      padding: 10px;

      border-radius: 15px;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,0.1);

    }


    #result {

      max-width: 500px;

      margin: 20px auto;

      padding: 25px;

      background: white;

      border-radius: 15px;

      font-size: 20px;

    }


    .success {

      color: green;

      font-weight: bold;

    }


    .error {

      color: red;

      font-weight: bold;

    }


    .loading {

      color: #555;

    }

  </style>

</head>


<body>


  <h1>📱 XO+ Attendance</h1>

  <p>Scan the attendee's QR Code</p>


  <div id="reader"></div>


  <div id="result">

    Ready to scan...

  </div>


<script>


/*
==========================================
GOOGLE APPS SCRIPT WEB APP
==========================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbzYA1CGoyrkixzPsyCkZk2IuevMRUwhK36FuX4K-5lH9tjyW7twbfURhETc8bEWtHG9/exec";


let alreadyScanning = false;


/*
==========================================
SHOW RESULT
==========================================
*/

function showResult(html) {

  document.getElementById("result").innerHTML = html;

}


/*
==========================================
SEND QR TO GOOGLE APPS SCRIPT
==========================================
*/

function sendAttendance(qrId) {


  showResult(
    '<div class="loading">' +
    '⏳ Checking attendance...' +
    '</div>'
  );


  /*
  Create unique JSONP callback
  */

  const callbackName =
    "attendanceCallback_" +
    Date.now();


  /*
  Create callback function
  */

  window[callbackName] =
    function(response) {


      /*
      SUCCESS
      */

      if (response.success) {


        showResult(

          '<div class="success">' +

          '🎉 ATTENDANCE CONFIRMED!' +

          '<br><br>' +

          '<strong>' +
          escapeHtml(response.name) +
          '</strong>' +

          '<br>' +

          escapeHtml(response.qrId) +

          '<br><br>' +

          'Checked in at ' +
          escapeHtml(response.time) +

          '</div>'

        );


      }


      /*
      ALREADY PRESENT
      */

      else if (
        response.alreadyPresent
      ) {


        showResult(

          '<div class="error">' +

          '⚠️ ALREADY CHECKED IN' +

          '<br><br>' +

          escapeHtml(response.name) +

          '<br>' +

          escapeHtml(response.message) +

          '</div>'

        );

      }


      /*
      OTHER ERROR
      */

      else {


        showResult(

          '<div class="error">' +

          '❌ ' +

          escapeHtml(
            response.message
          ) +

          '</div>'

        );

      }


      /*
      Clean up
      */

      delete window[callbackName];

      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


      /*
      Allow scanning again
      */

      setTimeout(
        function() {

          alreadyScanning = false;

          showResult(
            "Ready to scan..."
          );

        },
        3000
      );

    };


  /*
  Create script request
  */

  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?qr=" +
    encodeURIComponent(qrId) +
    "&callback=" +
    callbackName;


  /*
  Error handling
  */

  script.onerror =
    function() {

      showResult(

        '<div class="error">' +

        '❌ Unable to connect to ' +
        'attendance system.' +

        '<br><br>' +

        'Please check your internet connection.'

        + '</div>'

      );


      delete window[callbackName];

      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


      alreadyScanning = false;

    };


  document.body.appendChild(script);

}


/*
==========================================
ESCAPE HTML
==========================================
*/

function escapeHtml(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/*
==========================================
QR SCANNER
==========================================
*/

function onScanSuccess(decodedText) {


  if (alreadyScanning) {

    return;

  }


  alreadyScanning = true;


  /*
  Remove spaces
  */

  const qrId =
    String(decodedText).trim();


  /*
  Validate XO QR
  */

  if (
    !qrId.startsWith("XO-")
  ) {


    showResult(

      '<div class="error">' +

      '⚠️ Invalid XO+ QR Code' +

      '</div>'

    );


    alreadyScanning = false;

    return;

  }


  /*
  Send to Apps Script
  */

  sendAttendance(qrId);

}


/*
==========================================
START CAMERA
==========================================
*/

const scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      },

      rememberLastUsedCamera: true

    },

    false

  );


scanner.render(
  onScanSuccess
);


</script>


</body>

</html>
