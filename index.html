<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>XO+ Attendance Scanner</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 30px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 20px;
    }

    #cameraContainer {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
    }

    #video {
      width: 100%;
      display: block;
    }

    #scanBox {
      position: absolute;
      width: 250px;
      height: 250px;
      border: 3px solid white;
      border-radius: 15px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      font-size: 19px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px 22px;
      font-size: 17px;
      cursor: pointer;
      margin: 8px;
    }

    #startButton {
      background: #111;
      color: white;
    }

    #stopButton {
      background: #d93025;
      color: white;
    }

    .success {
      color: #16803c;
      font-weight: bold;
    }

    .error {
      color: #d93025;
      font-weight: bold;
    }

    .checking {
      color: #555;
      font-weight: bold;
    }

    .name {
      font-size: 27px;
      margin: 12px 0;
    }

    .qrid {
      color: #666;
      font-size: 17px;
    }

    #status {
      margin-top: 10px;
      font-size: 15px;
      color: #666;
    }

    canvas {
      display: none;
    }

  </style>

</head>


<body>

  <h1>📱 XO+ Attendance</h1>

  <div class="subtitle">
    Scan the attendee's QR Code
  </div>


  <div id="cameraContainer">

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

    <div id="scanBox"></div>

  </div>


  <div>

    <button id="startButton">
      📷 Start Camera
    </button>

    <button id="stopButton">
      ⛔ Stop Camera
    </button>

  </div>


  <div id="status">
    Camera not started.
  </div>


  <div id="result">
    Ready to scan...
  </div>


  <canvas id="canvas"></canvas>


<script>


/*
====================================================
GOOGLE APPS SCRIPT WEB APP
====================================================
*/

const API_URL =
  "https://script.google.com/macros/s/AKfycbzYA1CGoyrkixzPsyCkZk2IuevMRUwhK36FuX4K-5lH9tjyW7twbfURhETc8bEWtHG9/exec";


/*
====================================================
ELEMENTS
====================================================
*/

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const result =
  document.getElementById("result");

const status =
  document.getElementById("status");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");


/*
====================================================
VARIABLES
====================================================
*/

let stream = null;

let scanning = false;

let processingQR = false;

let detector = null;


/*
====================================================
START CAMERA
====================================================
*/

async function startCamera() {

  try {

    status.textContent =
      "Requesting camera permission...";


    /*
    Check camera support
    */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Your browser does not support camera access."
      );

    }


    /*
    Request the BACK camera
    */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    /*
    Attach camera to video
    */

    video.srcObject = stream;


    await video.play();


    /*
    Check BarcodeDetector
    */

    if (
      "BarcodeDetector" in window
    ) {

      detector =
        new BarcodeDetector({
          formats: ["qr_code"]
        });

      status.textContent =
        "📷 Camera ready — point it at the QR code.";

      scanning = true;

      scanLoop();

    } else {

      status.textContent =
        "⚠️ Your browser does not support native QR scanning.";

      result.innerHTML =
        '<div class="error">' +
        'QR detection is not supported by this browser.' +
        '<br><br>' +
        'Please use a current Chrome browser.' +
        '</div>';

    }


  } catch (error) {

    console.error(error);


    status.textContent =
      "Camera permission failed.";


    let message =
      error.message;


    if (
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "Camera permission was denied. " +
        "Please allow camera access in your browser settings.";

    }


    if (
      error.name ===
      "NotFoundError"
    ) {

      message =
        "No camera was found on this device.";

    }


    if (
      error.name ===
      "NotReadableError"
    ) {

      message =
        "The camera is being used by another application.";

    }


    result.innerHTML =

      '<div class="error">' +

      '❌ ' +

      escapeHtml(message) +

      '<br><br>' +

      '<small>' +

      'Open your browser site settings and allow Camera.'

      +

      '</small>' +

      '</div>';

  }

}


/*
====================================================
SCAN LOOP
====================================================
*/

async function scanLoop() {

  if (!scanning) {
    return;
  }


  if (
    !detector ||
    video.readyState <
    HTMLMediaElement.HAVE_ENOUGH_DATA
  ) {

    requestAnimationFrame(scanLoop);

    return;

  }


  try {

    const barcodes =
      await detector.detect(video);


    if (
      barcodes &&
      barcodes.length > 0
    ) {

      const qrText =
        barcodes[0].rawValue;


      if (qrText) {

        handleQRCode(qrText);

      }

    }

  } catch (error) {

    console.log(
      "QR detection:",
      error
    );

  }


  requestAnimationFrame(scanLoop);

}


/*
====================================================
HANDLE QR CODE
====================================================
*/

function handleQRCode(qrText) {

  if (processingQR) {
    return;
  }


  const qrId =
    String(qrText).trim();


  /*
  Make sure this is our XO+ QR
  */

  if (
    !qrId.toUpperCase().startsWith("XO-")
  ) {

    result.innerHTML =

      '<div class="error">' +

      '⚠️ Invalid XO+ QR Code' +

      '</div>';


    return;

  }


  processingQR = true;


  /*
  Stop scanning temporarily
  */

  scanning = false;


  result.innerHTML =

    '<div class="checking">' +

    '⏳ Checking attendance...' +

    '<br><br>' +

    '<small>' +

    escapeHtml(qrId) +

    '</small>' +

    '</div>';


  sendAttendance(qrId);

}


/*
====================================================
SEND ATTENDANCE TO APPS SCRIPT
====================================================
*/

function sendAttendance(qrId) {


  const callbackName =
    "attendanceCallback_" +
    Date.now();


  /*
  Create JSONP callback
  */

  window[callbackName] =
    function(response) {


      console.log(
        "Apps Script response:",
        response
      );


      if (
        response.success
      ) {

        result.innerHTML =

          '<div class="success">' +

          '🎉 ATTENDANCE CONFIRMED!' +

          '<div class="name">' +

          escapeHtml(
            response.name
          ) +

          '</div>' +

          '<div class="qrid">' +

          escapeHtml(
            response.qrId
          ) +

          '</div>' +

          '<br>' +

          '🕐 Checked in at ' +

          escapeHtml(
            response.time
          ) +

          '</div>';


      } else {

        result.innerHTML =

          '<div class="error">' +

          '⚠️ ' +

          escapeHtml(
            response.message
          ) +

          '</div>';

      }


      /*
      Clean up callback
      */

      delete window[
        callbackName
      ];


      const script =
        document.getElementById(
          callbackName
        );


      if (script) {
        script.remove();
      }


      /*
      Wait before next scan
      */

      setTimeout(
        function() {

          processingQR = false;

          result.innerHTML =
            "Ready for next attendee...";

          scanning = true;

        },
        3500
      );

    };


  /*
  Create request
  */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    API_URL +

    "?action=attendance" +

    "&qrId=" +

    encodeURIComponent(qrId) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    );


  /*
  Connection error
  */

  script.onerror =
    function() {

      console.error(
        "Apps Script connection failed."
      );


      result.innerHTML =

        '<div class="error">' +

        '❌ Unable to connect to attendance system.' +

        '<br><br>' +

        '<small>' +

        'The QR was detected, but Google Apps Script did not respond.'

        +

        '</small>' +

        '</div>';


      delete window[
        callbackName
      ];


      script.remove();


      processingQR = false;


      setTimeout(
        function() {

          scanning = true;

        },
        3000
      );

    };


  document.body.appendChild(
    script
  );

}


/*
====================================================
STOP CAMERA
====================================================
*/

function stopCamera() {

  scanning = false;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );

    stream = null;

  }


  video.srcObject = null;


  status.textContent =
    "Camera stopped.";

}


/*
====================================================
ESCAPE HTML
====================================================
*/

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value == null
      ? ""
      : value;

  return div.innerHTML;

}


/*
====================================================
BUTTONS
====================================================
*/

startButton.addEventListener(
  "click",
  startCamera
);


stopButton.addEventListener(
  "click",
  stopCamera
);


</script>

</body>

</html>
