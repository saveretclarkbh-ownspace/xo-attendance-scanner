<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>XO+ Attendance</title>


<!-- =====================================================
     jsQR
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #eef1f7;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 10px 0 2px;
  font-size: 30px;
}

.subtitle {
  color: #666;
  margin-bottom: 25px;
}


/* =====================================================
   SCANNER
   ===================================================== */

.scanner-container {
  position: relative;
  width: 100%;
  max-width: 560px;
  height: 350px;
  margin: auto;

  background: #050505;

  border-radius: 28px;

  overflow: hidden;

  border: 4px solid #ddd;
}

#video {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.scan-frame {
  position: absolute;

  width: 70%;
  height: 70%;

  left: 15%;
  top: 15%;

  border: 3px solid white;

  border-radius: 28px;

  pointer-events: none;
}

.scan-line {
  position: absolute;

  width: 60%;

  height: 3px;

  left: 20%;
  top: 50%;

  background: white;

  box-shadow:
    0 0 10px white;

  pointer-events: none;
}


/* =====================================================
   BUTTONS
   ===================================================== */

button {
  width: 100%;
  max-width: 560px;

  border: none;

  padding: 18px;

  margin-top: 16px;

  border-radius: 18px;

  font-size: 20px;
  font-weight: bold;

  color: white;

  cursor: pointer;
}

#startButton {
  background: #171b2d;
}

#stopButton {
  background: #e51b23;
}

#uploadButton {
  background: #2864df;
}


/* =====================================================
   STATUS
   ===================================================== */

#status {
  margin: 16px auto;

  max-width: 560px;

  color: #666;

  font-size: 17px;
}

#result {
  max-width: 560px;

  margin: 20px auto;
}


/* =====================================================
   ATTENDANCE CARD
   ===================================================== */

.attendance-card {

  display: none;

  background: white;

  border-radius: 28px;

  padding: 30px 20px;

  margin-top: 20px;

  box-shadow:
    0 8px 30px rgba(0,0,0,0.10);
}

.success-icon {

  width: 70px;
  height: 70px;

  margin: auto;

  border-radius: 50%;

  background: #1faa59;

  color: white;

  font-size: 45px;

  line-height: 70px;
}

.attendance-title {

  font-size: 28px;

  margin: 18px 0 10px;
}

.attendance-name {

  font-size: 25px;

  font-weight: bold;

  margin-bottom: 12px;
}

.attendance-qr {

  font-size: 18px;

  color: #555;

  margin-bottom: 10px;
}

.attendance-time {

  font-size: 18px;

  margin-bottom: 15px;
}

.confirmation-message {

  font-size: 17px;

  margin-bottom: 20px;
}

.countdown-label {

  font-size: 14px;

  color: #777;
}

.countdown {

  font-size: 22px;

  font-weight: bold;

  margin: 8px;
}

.progress-track {

  height: 8px;

  background: #ddd;

  border-radius: 10px;

  overflow: hidden;

  margin-bottom: 20px;
}

#confirmationProgress {

  height: 100%;

  width: 100%;

  background: #1faa59;
}

#closeAttendanceButton {

  margin-top: 0;

  background: #171b2d;

  font-size: 17px;
}


/* =====================================================
   ERROR
   ===================================================== */

.error-card {

  background: white;

  border-radius: 25px;

  padding: 25px;

  color: #c62828;

  font-weight: bold;

  font-size: 18px;

  line-height: 1.5;
}

</style>

</head>


<body>


<h1>XO+ Attendance</h1>

<div class="subtitle">
  Scan the attendee's QR Code
</div>


<!-- =====================================================
     SCANNER
     ===================================================== -->

<div class="scanner-container">

  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>

  <div class="scan-frame"></div>

  <div class="scan-line"></div>

</div>


<!-- =====================================================
     BUTTONS
     ===================================================== -->

<button id="startButton">
  Start Camera
</button>


<button id="stopButton">
  Stop Camera
</button>


<button id="uploadButton" type="button">
  Upload QR from Gallery
</button>


<input
  id="qrFileInput"
  type="file"
  accept="image/*"
  hidden
>


<div id="status">
  Camera not started.
</div>


<!-- =====================================================
     RESULT
     ===================================================== -->

<div id="result"></div>


<!-- =====================================================
     ATTENDANCE CONFIRMATION
     ===================================================== -->

<div class="attendance-card" id="attendanceCard">

  <div class="success-icon">
    ✓
  </div>

  <h2
    id="attendanceTitle"
    class="attendance-title"
  >
    Attendance Confirmed!
  </h2>

  <div
    id="attendanceName"
    class="attendance-name"
  >
    Attendee
  </div>

  <div
    id="attendanceQr"
    class="attendance-qr"
  >
    XO-0000
  </div>

  <div
    id="attendanceTime"
    class="attendance-time"
  >
    Checked in at --
  </div>

  <div
    id="attendanceMessage"
    class="confirmation-message"
  >
    Attendance recorded successfully.
  </div>

  <div class="countdown-wrap">

    <div class="countdown-label">
      This confirmation will close automatically
    </div>

    <div
      id="confirmationCountdown"
      class="countdown"
    >
      60 seconds
    </div>

    <div class="progress-track">

      <div
        id="confirmationProgress"
      ></div>

    </div>

  </div>


  <button
    id="closeAttendanceButton"
    type="button"
  >
    ✓ Done — Continue Scanning
  </button>

</div>


<script>

/* ==========================================================
   CONFIGURATION
   ========================================================== */


/*
 IMPORTANT:
 This is your CURRENT Apps Script Web App URL.
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbx5BJw5IE7VtLSHOt5GjPbPfvn897a407iLhZ581s5kkWn8u3ztBzgG_pRmT0eAFvJf/exec";


/* ==========================================================
   ELEMENTS
   ========================================================== */

const video =
  document.getElementById("video");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const uploadButton =
  document.getElementById("uploadButton");

const qrFileInput =
  document.getElementById("qrFileInput");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");

const attendanceCard =
  document.getElementById("attendanceCard");

const attendanceTitle =
  document.getElementById("attendanceTitle");

const attendanceName =
  document.getElementById("attendanceName");

const attendanceQr =
  document.getElementById("attendanceQr");

const attendanceTime =
  document.getElementById("attendanceTime");

const attendanceMessage =
  document.getElementById("attendanceMessage");

const confirmationCountdown =
  document.getElementById("confirmationCountdown");

const confirmationProgress =
  document.getElementById("confirmationProgress");

const closeAttendanceButton =
  document.getElementById("closeAttendanceButton");


/* ==========================================================
   VARIABLES
   ========================================================== */

let stream = null;

let scanning = false;

let animationFrame = null;

let lastScannedQr = "";

let lastScanTime = 0;

let confirmationTimer = null;


/* ==========================================================
   START CAMERA
   ========================================================== */

startButton.addEventListener(
  "click",
  startCamera
);


async function startCamera() {

  try {

    stopCamera();

    status.textContent =
      "Requesting camera permission...";

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    video.srcObject = stream;

    await video.play();

    scanning = true;

    status.textContent =
      "Camera ready — point it at the QR code.";

    scanCamera();


  } catch (error) {

    console.error(error);

    status.textContent =
      "Camera permission was denied or unavailable.";

  }
}


/* ==========================================================
   STOP CAMERA
   ========================================================== */

stopButton.addEventListener(
  "click",
  stopCamera
);


function stopCamera() {

  scanning = false;

  if (animationFrame) {

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame = null;
  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    stream = null;
  }


  video.srcObject = null;

  status.textContent =
    "Camera not started.";
}


/* ==========================================================
   CAMERA QR SCANNING
   ========================================================== */

function scanCamera() {

  if (!scanning) {
    return;
  }


  if (
    video.readyState >=
    HTMLMediaElement.HAVE_ENOUGH_DATA
  ) {

    const canvas =
      document.createElement("canvas");

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const context =
      canvas.getContext("2d", {
        willReadFrequently: true
      });


    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      context.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );


    if (code && code.data) {

      handleQRCode(
        code.data
      );

      return;
    }
  }


  animationFrame =
    requestAnimationFrame(
      scanCamera
    );
}


/* ==========================================================
   GALLERY UPLOAD
   ========================================================== */

uploadButton.addEventListener(
  "click",
  function() {

    qrFileInput.value = "";

    qrFileInput.click();

  }
);


qrFileInput.addEventListener(
  "change",
  handleImageUpload
);


function handleImageUpload(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }


  status.textContent =
    "Reading uploaded QR image...";


  const reader =
    new FileReader();


  reader.onload = function(e) {

    const image =
      new Image();


    image.onload = function() {

      const canvas =
        document.createElement("canvas");


      const maxSize = 1600;

      let width =
        image.naturalWidth;

      let height =
        image.naturalHeight;


      if (width > maxSize) {

        const ratio =
          maxSize / width;

        width = maxSize;

        height =
          height * ratio;
      }


      if (height > maxSize) {

        const ratio =
          maxSize / height;

        height = maxSize;

        width =
          width * ratio;
      }


      canvas.width = width;

      canvas.height = height;


      const context =
        canvas.getContext("2d", {
          willReadFrequently: true
        });


      context.drawImage(
        image,
        0,
        0,
        width,
        height
      );


      const imageData =
        context.getImageData(
          0,
          0,
          width,
          height
        );


      const code =
        jsQR(
          imageData.data,
          imageData.width,
          imageData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );


      if (code && code.data) {

        handleQRCode(
          code.data
        );

      } else {

        status.textContent =
          "No QR code was found in the uploaded image.";

      }
    };


    image.onerror = function() {

      status.textContent =
        "Unable to read the selected image.";

    };


    image.src =
      e.target.result;
  };


  reader.readAsDataURL(file);
}


/* ==========================================================
   HANDLE QR CODE
   ========================================================== */

function handleQRCode(qrValue) {

  qrValue =
    String(qrValue || "")
      .trim();


  if (!qrValue) {
    return;
  }


  /*
   Prevent the same QR from firing
   repeatedly while the camera is
   still pointed at it.
  */

  const now =
    Date.now();


  if (
    qrValue === lastScannedQr &&
    now - lastScanTime < 5000
  ) {

    return;
  }


  lastScannedQr =
    qrValue;

  lastScanTime =
    now;


  /*
   Stop camera after detecting QR.
  */

  stopCamera();


  status.textContent =
    "QR detected. Checking attendance...";


  result.innerHTML = "";


  /*
   Clean QR value.
  */

  const qrId =
    extractQrId(qrValue);


  if (!qrId) {

    showError(
      "Invalid QR code.",
      "The scanned QR does not contain a valid XO QR ID."
    );

    return;
  }


  callAttendanceAPI(
    qrId
  );
}


/* ==========================================================
   EXTRACT QR ID
   ========================================================== */

function extractQrId(value) {

  value =
    String(value)
      .trim();


  /*
   Direct QR:
   XO-0001
  */

  const directMatch =
    value.match(
      /XO-\d{4}/i
    );


  if (directMatch) {

    return directMatch[0]
      .toUpperCase();
  }


  return null;
}


/* ==========================================================
   IMPORTANT:
   JSONP API CALL
   ==========================================================

   DO NOT replace this with fetch().

   GitHub Pages -> Apps Script is cross-origin.

   JSONP allows the request without
   browser CORS blocking.
   ========================================================== */

function callAttendanceAPI(qrId) {

  const callbackName =
    "xoAttendanceCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  let finished = false;


  const script =
    document.createElement("script");


  /*
   Google Apps Script URL
  */

  const url =
    API_URL +
    "?action=attendance" +
    "&qrId=" +
    encodeURIComponent(qrId) +
    "&callback=" +
    encodeURIComponent(callbackName);


  /*
   Create callback on window.
  */

  window[callbackName] =
    function(data) {

      if (finished) {
        return;
      }

      finished = true;


      cleanup();


      console.log(
        "XO+ API response:",
        data
      );


      if (
        data &&
        data.success === true
      ) {

        showAttendanceConfirmation(
          data
        );

      } else if (
        data &&
        data.alreadyPresent === true
      ) {

        showAlreadyPresent(
          data
        );

      } else {

        showError(
          "Unable to record attendance.",
          data && data.message
            ? data.message
            : "The attendance API returned an unexpected response."
        );
      }
    };


  /*
   IMPORTANT:
   JSONP uses <script>, NOT fetch.
  */

  script.src =
    url;

  script.async =
    true;


  script.onerror =
    function() {

      if (finished) {
        return;
      }

      finished = true;

      cleanup();


      showError(

        "Unable to connect to attendance system.",

        "The Apps Script API could not be loaded. " +
        "Please make sure the Web App is deployed as Anyone."
      );
    };


  document
    .head
    .appendChild(script);


  /*
   Timeout
  */

  setTimeout(
    function() {

      if (finished) {
        return;
      }

      finished = true;

      cleanup();


      showError(

        "Unable to connect to attendance system.",

        "The Apps Script API did not respond within 15 seconds."
      );

    },
    15000
  );


  function cleanup() {

    if (script.parentNode) {

      script.parentNode
        .removeChild(script);
    }


    try {

      delete window[
        callbackName
      ];

    } catch (error) {

      window[
        callbackName
      ] = undefined;
    }
  }
}


/* ==========================================================
   ATTENDANCE CONFIRMATION
   ========================================================== */

function showAttendanceConfirmation(
  data
) {

  clearConfirmationTimer();


  attendanceCard.style.display =
    "block";


  attendanceTitle.textContent =
    "Attendance Confirmed!";


  /*
   WHOLE NAME
  */

  attendanceName.textContent =
    data.name ||
    "Attendee";


  attendanceQr.textContent =
    data.qrId ||
    "";


  attendanceTime.textContent =
    "Checked in at " +
    (data.time || "--");


  attendanceMessage.textContent =
    data.message ||
    "Attendance recorded successfully.";


  confirmationProgress.style.width =
    "100%";


  let seconds =
    60;


  confirmationCountdown.textContent =
    seconds +
    " seconds";


  /*
   Scroll confirmation into view
  */

  attendanceCard.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });


  confirmationTimer =
    setInterval(
      function() {

        seconds--;


        confirmationCountdown.textContent =
          seconds +
          " seconds";


        const percentage =
          (seconds / 60) * 100;


        confirmationProgress.style.width =
          percentage + "%";


        if (seconds <= 0) {

          clearConfirmationTimer();

          closeAttendance();

        }

      },
      1000
    );
}


/* ==========================================================
   ALREADY PRESENT
   ========================================================== */

function showAlreadyPresent(
  data
) {

  clearConfirmationTimer();


  attendanceCard.style.display =
    "block";


  attendanceTitle.textContent =
    "Already Checked In";


  attendanceName.textContent =
    data.name ||
    "Attendee";


  attendanceQr.textContent =
    data.qrId ||
    "";


  attendanceTime.textContent =
    data.message ||
    "This attendee has already checked in.";


  attendanceMessage.textContent =
    "No new attendance record was created.";


  confirmationCountdown.textContent =
    "60 seconds";


  confirmationProgress.style.width =
    "100%";


  attendanceCard.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });


  let seconds =
    60;


  confirmationTimer =
    setInterval(
      function() {

        seconds--;


        confirmationCountdown.textContent =
          seconds +
          " seconds";


        confirmationProgress.style.width =
          ((seconds / 60) * 100) +
          "%";


        if (seconds <= 0) {

          clearConfirmationTimer();

          closeAttendance();
        }

      },
      1000
    );
}


/* ==========================================================
   CLOSE CONFIRMATION
   ========================================================== */

closeAttendanceButton.addEventListener(
  "click",
  closeAttendance
);


function closeAttendance() {

  clearConfirmationTimer();


  attendanceCard.style.display =
    "none";


  result.innerHTML =
    "";


  lastScannedQr =
    "";


  status.textContent =
    "Ready to scan...";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* ==========================================================
   CLEAR TIMER
   ========================================================== */

function clearConfirmationTimer() {

  if (confirmationTimer) {

    clearInterval(
      confirmationTimer
    );

    confirmationTimer =
      null;
  }
}


/* ==========================================================
   ERROR DISPLAY
   ========================================================== */

function showError(
  title,
  message
) {

  result.innerHTML =

    '<div class="error-card">' +

      '<div style="font-size:45px;">✕</div>' +

      '<div style="font-size:24px;margin-bottom:15px;">' +
        escapeHtml(title) +
      '</div>' +

      '<div>' +
        escapeHtml(message) +
      '</div>' +

    '</div>';


  status.textContent =
    "Ready to scan...";
}


/* ==========================================================
   HTML ESCAPE
   ========================================================== */

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

</script>

</body>
</html>
