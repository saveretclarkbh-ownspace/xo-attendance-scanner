<script>

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzYA1CGoyrkixzPsyCkZk2IuevMRUwhK36FuX4K-5lH9tjyW7twbfURhETc8bEWtHG9/exec";

let scanner = null;
let scanning = false;
let processing = false;

const statusBox =
  document.getElementById("status");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");


function setStatus(message, type = "") {

  statusBox.className = "status " + type;
  statusBox.innerHTML = message;

}


async function startScanner() {

  if (scanning) return;

  try {

    setStatus(
      "Requesting camera permission..."
    );

    scanner =
      new Html5Qrcode("reader");

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0
      },

      onScanSuccess,
      onScanFailure

    );

    scanning = true;

    startButton.style.display = "none";
    stopButton.style.display = "block";

    setStatus(
      "📷 Camera ready.<br>Scan the attendee's QR Code."
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "❌ Unable to access the camera.<br><br>" +
      "Please allow camera permission in Chrome " +
      "and make sure this page is opened using HTTPS.",
      "error"
    );

  }

}


async function stopScanner() {

  if (!scanner || !scanning) {
    return;
  }

  try {

    await scanner.stop();
    scanner.clear();

  } catch (error) {

    console.error(error);

  }

  scanning = false;

  startButton.style.display = "block";
  stopButton.style.display = "none";

}


async function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;

  console.log(
    "QR detected:",
    decodedText
  );

  await stopScanner();

  const qrId =
    extractQrId(decodedText);

  if (!qrId) {

    processing = false;

    setStatus(
      "❌ Invalid XO+ QR Code.<br><br>" +
      "Please scan an official XO+ attendee QR code.",
      "error"
    );

    return;
  }

  setStatus(
    "⏳ Checking attendance...<br>" +
    "QR ID: " +
    escapeHtml(qrId)
  );

  sendAttendance(qrId);

}


function extractQrId(text) {

  if (!text) {
    return null;
  }

  text =
    String(text).trim();

  /* Direct QR: XO-0008 */

  const direct =
    text.match(/^XO-\d+$/i);

  if (direct) {

    return direct[0]
      .toUpperCase();

  }


  /* QR contains URL */

  try {

    const url =
      new URL(text);

    const qrId =
      url.searchParams.get("qrId");

    if (
      qrId &&
      /^XO-\d+$/i.test(qrId)
    ) {

      return qrId
        .toUpperCase();

    }

  } catch (error) {

    // Not a URL
  }


  /* Search anywhere in QR text */

  const match =
    text.match(/XO-\d+/i);

  if (match) {

    return match[0]
      .toUpperCase();

  }

  return null;

}


/* ==========================================================
   ATTENDANCE REQUEST
   ========================================================== */

function sendAttendance(qrId) {

  const callbackName =
    "xoCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  let finished = false;


  const script =
    document.createElement("script");


  function cleanup() {

    if (finished) {
      return;
    }

    finished = true;

    clearTimeout(timeout);

    try {
      delete window[callbackName];
    } catch (error) {
      window[callbackName] = undefined;
    }

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

  }


  const timeout =
    setTimeout(
      function() {

        cleanup();

        processing = false;

        console.error(
          "Apps Script timeout"
        );

        setStatus(
          "❌ Unable to connect to the attendance system.<br><br>" +
          "Google Apps Script did not respond.<br><br>" +
          "Please try again.",
          "error"
        );

      },
      20000
    );


  window[callbackName] =
    function(result) {

      cleanup();

      processing = false;

      console.log(
        "Apps Script response:",
        result
      );

      handleAttendanceResult(
        result
      );

    };


  script.onerror =
    function(error) {

      cleanup();

      processing = false;

      console.error(
        "JSONP error:",
        error
      );

      setStatus(
        "❌ Unable to connect to the attendance system.<br><br>" +
        "Please try scanning again.",
        "error"
      );

    };


  const requestUrl =
    WEB_APP_URL +
    "?action=attendance" +
    "&qrId=" +
    encodeURIComponent(qrId) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&timestamp=" +
    Date.now();


  console.log(
    "Sending attendance request:",
    requestUrl
  );


  script.src =
    requestUrl;


  script.async = true;


  document.head.appendChild(
    script
  );

}


/* ==========================================================
   RESULT
   ========================================================== */

function handleAttendanceResult(result) {

  if (!result) {

    setStatus(
      "❌ Empty response from attendance system.",
      "error"
    );

    return;
  }


  console.log(
    "Attendance result:",
    result
  );


  /* SUCCESS */

  if (
    result.success === true
  ) {

    setStatus(

      "<div class='name'>" +
      escapeHtml(
        result.name ||
        "Attendee"
      ) +
      "</div>" +

      "✅ <strong>Attendance Confirmed!</strong><br><br>" +

      "📅 " +
      escapeHtml(
        result.date ||
        ""
      ) +

      "<br>" +

      "🕒 " +
      escapeHtml(
        result.time ||
        ""
      ) +

      "<br><br>" +

      "QR ID: " +
      escapeHtml(
        result.qrId ||
        ""
      ),

      "success"

    );


    setTimeout(
      function() {

        setStatus(
          "Ready to scan the next attendee..."
        );

        startScanner();

      },
      4000
    );

    return;

  }


  /* ALREADY PRESENT */

  if (
    result.alreadyPresent === true
  ) {

    setStatus(

      "<div class='name'>" +
      escapeHtml(
        result.name ||
        "Attendee"
      ) +
      "</div>" +

      "⚠️ <strong>Already Checked In</strong><br><br>" +

      escapeHtml(
        result.message ||
        "This attendee is already present."
      ) +

      (
        result.time
          ? "<br><br>🕒 " +
            escapeHtml(
              result.time
            )
          : ""
      ),

      "warning"

    );


    setTimeout(
      function() {

        setStatus(
          "Ready to scan the next attendee..."
        );

        startScanner();

      },
      4000
    );

    return;

  }


  /* ERROR */

  setStatus(

    "❌ " +
    escapeHtml(
      result.message ||
      "Attendance could not be recorded."
    ),

    "error"

  );


  setTimeout(
    function() {

      setStatus(
        "Ready to scan..."
      );

      startScanner();

    },
    4000
  );

}


/* ==========================================================
   HTML ESCAPE
   ========================================================== */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==========================================================
   SCAN FAILURE
   ========================================================== */

function onScanFailure(error) {

  // Normal scanner failures are ignored.

}

</script>
