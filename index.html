<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#ffffff"
>

<title>XO+ Attendance</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body {
  background: #ffffff;
  color: #111827;
  padding: 20px 16px 40px;
}


/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.container {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
}


/* =========================================================
   LOGO
   ========================================================= */

.logo-wrapper {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 22px;
}

.logo-image {
  display: block;
  width: auto;
  max-width: 260px;
  max-height: 90px;
  object-fit: contain;
}


/*
   IMPORTANT:

   Change the filename in the <img> below if your
   GitHub logo has a different filename.
*/


/* =========================================================
   SCANNER CARD
   ========================================================= */

.scanner-card {
  background: #ffffff;
  border-radius: 22px;
  padding: 18px;
  box-shadow:
    0 8px 30px rgba(0, 0, 0, 0.08);

  border: 1px solid #eeeeee;
}


/* =========================================================
   VIDEO
   ========================================================= */

.video-wrapper {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 18px;
  background: #111827;
}

#video {
  width: 100%;
  height: auto;
  min-height: 280px;
  max-height: 430px;

  object-fit: cover;

  display: block;

  background: #111827;
}


/* =========================================================
   SCAN BOX
   ========================================================= */

#scanBox {
  position: absolute;

  width: 62%;
  aspect-ratio: 1 / 1;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  border: 3px solid #ffffff;

  border-radius: 18px;

  pointer-events: none;

  box-shadow:
    0 0 0 9999px rgba(0, 0, 0, 0.18);
}


/* =========================================================
   SCANNER STATUS
   ========================================================= */

#status {
  text-align: center;

  margin-top: 14px;

  min-height: 24px;

  font-size: 14px;

  font-weight: 600;

  color: #555555;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.button-container {
  display: flex;

  flex-direction: column;

  width: 100%;

  margin-top: 18px;
}


/*
   IMPORTANT:
   margin-bottom creates the visible space
   between each button.
*/

#startButton,
#stopButton,
#uploadButton {

  width: 100%;

  min-height: 52px;

  border: none;

  border-radius: 14px;

  font-size: 16px;

  font-weight: 700;

  cursor: pointer;

  transition:
    transform 0.15s ease,
    opacity 0.15s ease;

  margin: 0 0 14px 0;

  padding: 14px 18px;

  -webkit-tap-highlight-color: transparent;
}

#startButton:active,
#stopButton:active,
#uploadButton:active {
  transform: scale(0.98);
}


/* Start */

#startButton {
  background: #0365d0;
  color: #ffffff;
}


/* Stop */

#stopButton {
  background: #eeeeee;
  color: #222222;
}


/* Upload */

#uploadButton {
  background: #ffffff;
  color: #0365d0;

  border: 2px solid #0365d0;
}


/* Hidden file input */

#qrFileInput {
  display: none;
}


/* =========================================================
   ATTENDANCE CARD
   ========================================================= */

.attendance-card {

  display: none;

  width: 100%;

  margin-top: 22px;

  padding: 26px 20px;

  background: #ffffff;

  border-radius: 22px;

  border: 1px solid #eeeeee;

  box-shadow:
    0 10px 35px rgba(0, 0, 0, 0.10);

  text-align: center;
}

.attendance-card.show {
  display: block;

  animation:
    cardAppear 0.25s ease;
}

@keyframes cardAppear {

  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


/* =========================================================
   SUCCESS ICON
   ========================================================= */

.success-icon {

  width: 64px;
  height: 64px;

  margin: 0 auto 14px;

  border-radius: 50%;

  background: #e8f7ed;

  color: #1b9c4a;

  display: flex;

  justify-content: center;

  align-items: center;

  font-size: 34px;

  font-weight: 800;
}


/* =========================================================
   ATTENDANCE TITLE
   ========================================================= */

.attendance-title {

  margin: 0 0 16px;

  font-size: 24px;

  line-height: 1.2;

  color: #111827;
}


/* =========================================================
   WHOLE NAME
   ========================================================= */

.attendance-name {

  font-size: 22px;

  line-height: 1.35;

  font-weight: 800;

  color: #0365d0;

  word-break: break-word;

  margin-bottom: 10px;
}


/* =========================================================
   QR ID
   ========================================================= */

.attendance-qr {

  display: inline-block;

  background: #f3f4f6;

  padding: 7px 12px;

  border-radius: 8px;

  font-size: 14px;

  font-weight: 700;

  color: #444444;

  margin-bottom: 14px;
}


/* =========================================================
   TIME
   ========================================================= */

.attendance-time {

  font-size: 15px;

  color: #555555;

  margin-bottom: 14px;
}


/* =========================================================
   MESSAGE
   ========================================================= */

.confirmation-message {

  font-size: 15px;

  line-height: 1.5;

  color: #333333;

  margin-bottom: 20px;
}


/* =========================================================
   COUNTDOWN
   ========================================================= */

.countdown-wrap {

  margin-top: 10px;

  margin-bottom: 20px;
}

.countdown-label {

  font-size: 12px;

  color: #777777;

  margin-bottom: 7px;
}

.countdown {

  font-size: 16px;

  font-weight: 800;

  color: #0365d0;

  margin-bottom: 8px;
}

.progress-track {

  width: 100%;

  height: 7px;

  border-radius: 20px;

  overflow: hidden;

  background: #eeeeee;
}

#confirmationProgress {

  height: 100%;

  width: 100%;

  background: #0365d0;

  border-radius: 20px;

  transition:
    width 1s linear;
}


/* =========================================================
   DONE BUTTON
   ========================================================= */

#closeAttendanceButton {

  width: 100%;

  min-height: 50px;

  border: none;

  border-radius: 13px;

  background: #0365d0;

  color: #ffffff;

  font-size: 15px;

  font-weight: 700;

  cursor: pointer;
}


/* =========================================================
   ERROR MESSAGE
   ========================================================= */

.error-message {

  display: none;

  margin-top: 16px;

  padding: 14px;

  border-radius: 12px;

  background: #fff1f1;

  color: #c62828;

  font-size: 14px;

  line-height: 1.5;

  text-align: center;
}

.error-message.show {
  display: block;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 420px) {

  body {
    padding:
      15px
      12px
      30px;
  }

  .scanner-card {
    padding: 14px;
  }

  .logo-image {
    max-width: 220px;
    max-height: 75px;
  }

  #video {
    min-height: 250px;
  }

  .attendance-name {
    font-size: 20px;
  }

}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 700px) {

  body {
    padding-top: 35px;
  }

  .container {
    max-width: 560px;
  }

}

</style>

</head>


<body>

<div class="container">


  <!-- =====================================================
       LOGO IMAGE
       ===================================================== -->

  <div class="logo-wrapper">

    <!--
      CHANGE ONLY THE IMAGE FILENAME IF NEEDED.

      Example:
      src="logo.png"
      src="XO-logo.png"
      src="XO+ Attendance.png"
    -->

    <img
      src="XO+ Attendance.png"
      alt="XO+"
      class="logo-image"
      onerror="this.style.display='none';"
    >

  </div>


  <!-- =====================================================
       SCANNER
       ===================================================== -->

  <div class="scanner-card">

    <div class="video-wrapper">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div id="scanBox"></div>

    </div>


    <div id="status">
      Ready to scan.
    </div>


    <!-- ===================================================
         BUTTONS
         =================================================== -->

    <div class="button-container">

      <button
        id="startButton"
        type="button"
      >
        Start Camera
      </button>


      <button
        id="stopButton"
        type="button"
      >
        Stop Camera
      </button>


      <button
        id="uploadButton"
        type="button"
      >
        Upload QR from Gallery
      </button>

    </div>


    <input
      id="qrFileInput"
      type="file"
      accept="image/*"
      hidden
    >


    <div
      id="errorMessage"
      class="error-message"
    ></div>

  </div>


  <!-- =====================================================
       ATTENDANCE CONFIRMATION
       ===================================================== -->

  <div class="attendance-card">

    <div class="success-icon">
      ✓
    </div>


    <h2
      id="attendanceTitle"
      class="attendance-title"
    >
      Attendance Confirmed!
    </h2>


    <div
      id="attendanceName"
      class="attendance-name"
    >
      Attendee
    </div>


    <div
      id="attendanceQr"
      class="attendance-qr"
    >
      XO-0000
    </div>


    <div
      id="attendanceTime"
      class="attendance-time"
    >
      🕐 Checked in at --
    </div>


    <div
      id="attendanceMessage"
      class="confirmation-message"
    >
      Attendance recorded successfully.
    </div>


    <div class="countdown-wrap">

      <div class="countdown-label">
        This confirmation will close automatically
      </div>

      <div
        id="confirmationCountdown"
        class="countdown"
      >
        60 seconds
      </div>

      <div class="progress-track">

        <div
          id="confirmationProgress"
        ></div>

      </div>

    </div>


    <button
      id="closeAttendanceButton"
      type="button"
    >
      ✓ Done — Continue Scanning
    </button>

  </div>

</div>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbx5BJw5IE7VtLSHOt5GjPbPfvn897a407iLhZ581s5kkWn8u3ztBzgG_pRmT0eAFvJf/exec";


/* =========================================================
   ELEMENTS
   ========================================================= */

const video =
  document.getElementById("video");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const uploadButton =
  document.getElementById("uploadButton");

const qrFileInput =
  document.getElementById("qrFileInput");

const statusElement =
  document.getElementById("status");

const errorMessage =
  document.getElementById("errorMessage");

const attendanceCard =
  document.querySelector(".attendance-card");

const closeAttendanceButton =
  document.getElementById(
    "closeAttendanceButton"
  );


let cameraStream = null;

let scanTimer = null;

let confirmationTimer = null;


/* =========================================================
   CAMERA
   ========================================================= */

async function startCamera() {

  clearError();

  try {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      showConnectionError(
        "Camera is not supported by this browser."
      );

      return;
    }


    stopCamera();


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    video.srcObject =
      cameraStream;


    await video.play();


    statusElement.textContent =
      "Camera ready. Point the camera at a QR code.";


    /*
      Start QR scanning if BarcodeDetector
      is supported.
    */

    startQRScanner();


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );

    showConnectionError(
      "Unable to access the camera. Please allow camera permission."
    );

  }

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopCamera() {

  if (scanTimer) {

    clearInterval(scanTimer);

    scanTimer = null;

  }


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(track => track.stop());

    cameraStream = null;

  }


  video.srcObject = null;

  statusElement.textContent =
    "Camera stopped.";

}


/* =========================================================
   QR SCANNER
   ========================================================= */

async function startQRScanner() {

  if (
    !("BarcodeDetector" in window)
  ) {

    statusElement.textContent =
      "Camera started. Use Upload QR from Gallery if scanning is unavailable.";

    return;

  }


  let detector;

  try {

    detector =
      new BarcodeDetector({
        formats: ["qr_code"]
      });

  } catch (error) {

    console.error(
      "BarcodeDetector error:",
      error
    );

    return;

  }


  scanTimer =
    setInterval(async () => {

      if (
        !video.srcObject ||
        video.readyState < 2
      ) {
        return;
      }


      try {

        const codes =
          await detector.detect(video);


        if (
          codes &&
          codes.length > 0
        ) {

          const value =
            codes[0].rawValue;


          if (value) {

            stopCamera();

            processQRValue(value);

          }

        }

      } catch (error) {

        console.log(
          "QR scan:",
          error
        );

      }

    }, 500);

}


/* =========================================================
   UPLOAD QR
   ========================================================= */

uploadButton.addEventListener(
  "click",
  function() {

    clearError();

    qrFileInput.value = "";

    qrFileInput.click();

  }
);


qrFileInput.addEventListener(
  "change",
  async function() {

    const file =
      qrFileInput.files &&
      qrFileInput.files[0];


    if (!file) {
      return;
    }


    statusElement.textContent =
      "Reading QR code from image...";


    try {

      const image =
        await loadImage(file);


      if (
        !("BarcodeDetector" in window)
      ) {

        showAttendanceError(
          "QR image scanning is not supported by this browser. Please use the camera scanner."
        );

        return;

      }


      const detector =
        new BarcodeDetector({
          formats: ["qr_code"]
        });


      const codes =
        await detector.detect(image);


      if (
        !codes ||
        codes.length === 0
      ) {

        showAttendanceError(
          "No QR code was found in the selected image."
        );

        return;

      }


      const value =
        codes[0].rawValue;


      if (!value) {

        showAttendanceError(
          "The QR code could not be read."
        );

        return;

      }


      processQRValue(value);


    } catch (error) {

      console.error(
        "Upload QR error:",
        error
      );

      showAttendanceError(
        "Unable to read this QR image."
      );

    }

  }
);


/* =========================================================
   LOAD IMAGE
   ========================================================= */

function loadImage(file) {

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();

      const url =
        URL.createObjectURL(file);


      img.onload = function() {

        URL.revokeObjectURL(url);

        resolve(img);

      };


      img.onerror =
        function() {

          URL.revokeObjectURL(url);

          reject(
            new Error(
              "Unable to load image."
            )
          );

        };


      img.src = url;

    }
  );

}


/* =========================================================
   PROCESS QR
   ========================================================= */

function processQRValue(value) {

  let qrId =
    String(value || "").trim();


  /*
    If QR contains a URL or additional text,
    try to extract XO-XXXX.
  */

  const match =
    qrId.match(
      /XO-\d+/i
    );


  if (match) {

    qrId =
      match[0];

  }


  if (!/^XO-\d+$/i.test(qrId)) {

    showAttendanceError(
      "Invalid XO+ QR code: " + qrId
    );

    return;

  }


  statusElement.textContent =
    "Checking " + qrId + "...";


  sendAttendance(qrId);

}


/* =========================================================
   SEND ATTENDANCE
   ========================================================= */

function sendAttendance(qrId) {

  qrId =
    String(qrId || "").trim();


  if (!qrId) {

    showConnectionError(
      "No QR ID was detected."
    );

    return;

  }


  const callbackName =
    "xoAttendanceCallback_" +
    Date.now();


  let finished = false;

  let script = null;


  /*
    JSONP CALLBACK
  */

  window[callbackName] =
    function(result) {

      finished = true;


      console.log(
        "XO+ Attendance API:",
        result
      );


      cleanup();


      /*
        IMPORTANT:

        alreadyPresent=true means the API
        CONNECTION WORKED.

        It is NOT a connection error.
      */

      if (
        result &&
        result.alreadyPresent === true
      ) {

        showAlreadyPresent(
          result.name,
          result.qrId,
          result.message
        );

        return;

      }


      /*
        Successful attendance
      */

      if (
        result &&
        result.success === true
      ) {

        showAttendanceConfirmation(

          result.name,

          result.qrId,

          result.time,

          result.message ||
          "Attendance recorded successfully."

        );

        return;

      }


      /*
        Valid API response but
        attendance was not recorded.
      */

      if (
        result &&
        result.success === false &&
        result.message
      ) {

        showAttendanceError(
          result.message
        );

        return;

      }


      showConnectionError(
        "Unexpected response from attendance system."
      );

    };


  /*
    CLEANUP
  */

  function cleanup() {

    try {

      delete window[callbackName];

    } catch (error) {

      window[callbackName] =
        undefined;

    }


    if (
      script &&
      script.parentNode
    ) {

      script.parentNode
        .removeChild(script);

    }

  }


  /*
    CREATE JSONP REQUEST
  */

  script =
    document.createElement("script");


  script.src =
    API_URL +
    "?action=attendance" +
    "&qrId=" +
    encodeURIComponent(qrId) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();


  script.async = true;


  /*
    REAL CONNECTION ERROR
  */

  script.onerror =
    function() {

      if (finished) {
        return;
      }


      finished = true;

      cleanup();


      showConnectionError(
        "The attendance system could not be reached."
      );

    };


  document.head.appendChild(script);


  /*
    TIMEOUT
  */

  setTimeout(
    function() {

      if (finished) {
        return;
      }


      finished = true;

      cleanup();


      showConnectionError(
        "The attendance system took too long to respond."
      );


    },
    15000
  );

}


/* =========================================================
   ATTENDANCE CONFIRMED
   ========================================================= */

function showAttendanceConfirmation(
  name,
  qrId,
  time,
  message
) {

  clearError();


  document.getElementById(
    "attendanceTitle"
  ).textContent =
    "Attendance Confirmed!";


  /*
    WHOLE NAME
  */

  document.getElementById(
    "attendanceName"
  ).textContent =
    name || "Attendee";


  document.getElementById(
    "attendanceQr"
  ).textContent =
    qrId || "";


  document.getElementById(
    "attendanceTime"
  ).textContent =
    "🕐 Checked in at " +
    (time || "--");


  document.getElementById(
    "attendanceMessage"
  ).textContent =
    message ||
    "Attendance recorded successfully.";


  attendanceCard
    .classList
    .add("show");


  attendanceCard
    .scrollIntoView({
      behavior: "smooth",
      block: "center"
    });


  startConfirmationCountdown();

}


/* =========================================================
   ALREADY PRESENT
   ========================================================= */

function showAlreadyPresent(
  name,
  qrId,
  message
) {

  clearError();


  document.getElementById(
    "attendanceTitle"
  ).textContent =
    "Already Checked In";


  document.getElementById(
    "attendanceName"
  ).textContent =
    name || "Attendee";


  document.getElementById(
    "attendanceQr"
  ).textContent =
    qrId || "";


  document.getElementById(
    "attendanceTime"
  ).textContent =
    "Attendance already recorded";


  document.getElementById(
    "attendanceMessage"
  ).textContent =
    message ||
    "This attendee has already checked in.";


  attendanceCard
    .classList
    .add("show");


  attendanceCard
    .scrollIntoView({
      behavior: "smooth",
      block: "center"
    });


  startConfirmationCountdown();

}


/* =========================================================
   60 SECOND COUNTDOWN
   ========================================================= */

function startConfirmationCountdown() {

  if (confirmationTimer) {

    clearInterval(
      confirmationTimer
    );

  }


  let seconds = 60;


  const countdown =
    document.getElementById(
      "confirmationCountdown"
    );


  const progress =
    document.getElementById(
      "confirmationProgress"
    );


  countdown.textContent =
    seconds + " seconds";


  progress.style.width =
    "100%";


  confirmationTimer =
    setInterval(
      function() {

        seconds--;


        countdown.textContent =
          seconds +
          (seconds === 1
            ? " second"
            : " seconds");


        progress.style.width =
          ((seconds / 60) * 100) +
          "%";


        if (seconds <= 0) {

          clearInterval(
            confirmationTimer
          );

          confirmationTimer =
            null;


          closeAttendance();

        }

      },
      1000
    );

}


/* =========================================================
   CLOSE ATTENDANCE
   ========================================================= */

function closeAttendance() {

  if (confirmationTimer) {

    clearInterval(
      confirmationTimer
    );

    confirmationTimer =
      null;

  }


  attendanceCard
    .classList
    .remove("show");


  statusElement.textContent =
    "Ready to scan.";


  document.getElementById(
    "attendanceName"
  ).textContent =
    "Attendee";


  document.getElementById(
    "attendanceQr"
  ).textContent =
    "XO-0000";


  document.getElementById(
    "attendanceTime"
  ).textContent =
    "🕐 Checked in at --";


  document.getElementById(
    "attendanceMessage"
  ).textContent =
    "Attendance recorded successfully.";


  document.getElementById(
    "confirmationCountdown"
  ).textContent =
    "60 seconds";


  document.getElementById(
    "confirmationProgress"
  ).style.width =
    "100%";

}


closeAttendanceButton
  .addEventListener(
    "click",
    closeAttendance
  );


/* =========================================================
   ERROR HANDLING
   ========================================================= */

function showConnectionError(
  message
) {

  console.error(
    "Connection error:",
    message
  );


  statusElement.textContent =
    "Attendance system connection problem.";


  errorMessage.textContent =
    message ||
    "Unable to connect to attendance system.";


  errorMessage
    .classList
    .add("show");

}


function showAttendanceError(
  message
) {

  console.warn(
    "Attendance error:",
    message
  );


  statusElement.textContent =
    "Unable to process QR code.";


  errorMessage.textContent =
    message ||
    "Unable to process this QR code.";


  errorMessage
    .classList
    .add("show");

}


function clearError() {

  errorMessage
    .classList
    .remove("show");


  errorMessage.textContent = "";

}


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

startButton.addEventListener(
  "click",
  startCamera
);


stopButton.addEventListener(
  "click",
  function() {

    stopCamera();

    clearError();

  }
);


/* =========================================================
   PAGE LOAD
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    statusElement.textContent =
      "Ready to scan.";

  }
);

</script>

</body>

</html>
