<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>XO+ Attendance Scanner</title>

  <!-- QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin-top: 10px;
      margin-bottom: 5px;
      font-size: 32px;
    }

    .subtitle {
      color: #555;
      font-size: 18px;
      margin-bottom: 20px;
    }

    #reader {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.10);
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      font-size: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .success {
      color: #16803c;
      font-weight: bold;
    }

    .error {
      color: #d93025;
      font-weight: bold;
    }

    .checking {
      color: #555;
      font-weight: bold;
    }

    .name {
      font-size: 26px;
      margin: 10px 0;
    }

    .qrid {
      font-size: 18px;
      color: #666;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #testButton {
      margin-top: 10px;
      background: #333;
      color: white;
    }

  </style>

</head>


<body>

  <h1>📱 XO+ Attendance</h1>

  <div class="subtitle">
    Scan the attendee's QR Code
  </div>

  <div id="reader"></div>

  <div id="result">
    Ready to scan...
  </div>


  <script>

    /*
     * IMPORTANT:
     * Put your Google Apps Script Web App URL here.
     */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzYA1CGoyrkixzPsyCkZk2IuevMRUwhK36FuX4K-5lH9tjyW7twbfURhETc8bEWtHG9/exec";


    let alreadyScanning = false;


    /**
     * =====================================================
     * QR SCAN SUCCESS
     * =====================================================
     */
    function onScanSuccess(decodedText) {

      if (alreadyScanning) {
        return;
      }

      alreadyScanning = true;

      const qrId = decodedText.trim();

      document.getElementById("result").innerHTML =
        '<div class="checking">' +
        '⏳ Checking attendance...<br><br>' +
        '<small>' +
        qrId +
        '</small>' +
        '</div>';

      sendAttendance(qrId);
    }


    /**
     * =====================================================
     * SEND ATTENDANCE TO GOOGLE APPS SCRIPT
     *
     * JSONP is used because this page is hosted on
     * GitHub Pages.
     * =====================================================
     */
    function sendAttendance(qrId) {

      const callbackName =
        "attendanceCallback_" +
        Date.now();

      window[callbackName] = function(response) {

        try {

          if (response.success) {

            document.getElementById("result").innerHTML =

              '<div class="success">' +

              '🎉 ATTENDANCE CONFIRMED!' +

              '<div class="name">' +
              escapeHtml(response.name) +
              '</div>' +

              '<div class="qrid">' +
              escapeHtml(response.qrId) +
              '</div>' +

              '<br>' +

              '🕐 Checked in at ' +
              escapeHtml(response.time) +

              '</div>';

          } else {

            document.getElementById("result").innerHTML =

              '<div class="error">' +

              '⚠️ ' +
              escapeHtml(response.message) +

              '</div>';
          }

        } catch (error) {

          document.getElementById("result").innerHTML =

            '<div class="error">' +
            '❌ Unable to process attendance.' +
            '</div>';
        }


        // Clean up
        delete window[callbackName];

        const script =
          document.getElementById(callbackName);

        if (script) {
          script.remove();
        }


        // Allow another scan
        setTimeout(function() {

          alreadyScanning = false;

          document.getElementById("result").innerHTML =
            "Ready for next attendee...";

        }, 4000);

      };


      const script =
        document.createElement("script");

      script.id = callbackName;

      script.src =
        API_URL +
        "?action=attendance" +
        "&qrId=" +
        encodeURIComponent(qrId) +
        "&callback=" +
        encodeURIComponent(callbackName);

      script.onerror = function() {

        document.getElementById("result").innerHTML =

          '<div class="error">' +
          '❌ Unable to connect to attendance system.' +
          '<br><br>' +
          '<small>Check the Google Apps Script deployment.</small>' +
          '</div>';

        delete window[callbackName];

        script.remove();

        alreadyScanning = false;
      };


      document.body.appendChild(script);
    }


    /**
     * =====================================================
     * SECURITY
     * =====================================================
     */
    function escapeHtml(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value == null ? "" : value;

      return div.innerHTML;
    }


    /**
     * =====================================================
     * START QR SCANNER
     * =====================================================
     */

    const scanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          rememberLastUsedCamera: true
        },

        false
      );


    scanner.render(
      onScanSuccess
    );

  </script>

</body>

</html>
