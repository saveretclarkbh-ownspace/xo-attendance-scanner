<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>XO+ Attendance</title>

  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #222;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      padding: 28px 24px 40px;
      text-align: center;
    }

    /* =========================
       HEADER
    ========================= */

    .logo {
      font-size: 42px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 20px;
      margin-bottom: 26px;
      font-size: 22px;
      color: #555;
    }

    /* =========================
       SCANNER
    ========================= */

    .scanner-card {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
      border: 1px solid #ddd;
    }

    #reader {
      width: 100%;
      min-height: 320px;
      background: #111;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      object-fit: cover;
    }

    /* Hide library buttons / unnecessary controls */
    #reader__dashboard_section {
      display: none !important;
    }

    #reader__status_span {
      display: none !important;
    }

    /* =========================
       RESULT
    ========================= */

    .result {
      margin: 22px auto;
      padding: 22px;
      width: 100%;
      max-width: 680px;
      min-height: 78px;
      border-radius: 18px;
      background: #ffffff;
      font-size: 21px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .result.success {
      color: #16723a;
      background: #e8f7ed;
      border: 1px solid #a5d4d0;
      font-weight: 700;
    }

    .result.error {
      color: #b42318;
      background: #fff0f0;
      border: 1px solid #f3b4b4;
      font-weight: 700;
    }

    .result.warning {
      color: #8a4b00;
      background: #fff7e6;
      border: 1px solid #f0d08a;
      font-weight: 700;
    }

    .result.loading {
      color: #555;
      background: #f7f7f7;
    }

    /* =========================
       BUTTONS
    ========================= */

    .button {
      width: 100%;
      max-width: 680px;
      margin: 12px auto;
      padding: 21px 20px;
      border-radius: 22px;
      font-size: 23px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s ease;
      display: block;
    }

    .button:active {
      transform: scale(0.98);
    }

    .start-button {
      background: #e51b23;
      color: #ffffff;
      border: none;
      box-shadow: 0 5px 15px rgba(229, 27, 35, 0.22);
    }

    .start-button:hover {
      background: #c9151c;
    }

    .stop-button {
      background: #f5f5f5;
      color: #222;
      border: 1px solid #ddd;
    }

    .upload-button {
      background: #ffffff;
      color: #c51d26;
      border: 3px solid #c51d26;
    }

    .upload-button:hover {
      background: #fff5f5;
    }

    input[type="file"] {
      display: none;
    }

    /* =========================
       STATUS
    ========================= */

    .camera-status {
      margin-top: 18px;
      font-size: 17px;
      color: #666;
    }

    .api-status {
      margin-top: 8px;
      font-size: 14px;
      color: #999;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .container {
        padding: 22px 16px 35px;
      }

      .logo {
        font-size: 36px;
      }

      h1 {
        font-size: 31px;
      }

      .subtitle {
        font-size: 19px;
        margin-top: 16px;
      }

      #reader {
        min-height: 300px;
      }

      .button {
        font-size: 20px;
        padding: 20px 15px;
      }

      .result {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="logo">📱</div>

  <h1>XO+ Attendance</h1>

  <div class="subtitle">
    Scan the attendee's QR Code
  </div>


  <!-- SCANNER -->

  <div class="scanner-card">

    <div id="reader"></div>

  </div>


  <!-- RESULT -->

  <div id="result" class="result loading">
    Ready to scan...
  </div>


  <!-- BUTTONS -->

  <button
    id="startButton"
    class="button start-button"
    onclick="startCamera()"
  >
    Start Camera
  </button>


  <button
    id="stopButton"
    class="button stop-button"
    onclick="stopCamera()"
  >
    Stop Camera
  </button>


  <label
    for="qrFile"
    class="button upload-button"
  >
    Upload QR from Gallery
  </label>

  <input
    type="file"
    id="qrFile"
    accept="image/*"
    onchange="scanImage(event)"
  >


  <div id="cameraStatus" class="camera-status">
    Camera is ready.
  </div>

  <div id="apiStatus" class="api-status">
    Attendance system ready.
  </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzYA1CGoyrkixzPsyCkZk2IuevMRUwhK36FuX4K-5lH9tjyW7twbfURhETc8bEWtHG9/exec";


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let qrScanner = null;

let cameraRunning = false;

let processingScan = false;

let jsonpCounter = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const resultElement =
  document.getElementById("result");

const cameraStatusElement =
  document.getElementById("cameraStatus");

const apiStatusElement =
  document.getElementById("apiStatus");


/* =========================================================
   RESULT HELPER
========================================================= */

function showResult(
  message,
  type = "loading"
) {

  resultElement.className =
    "result " + type;

  resultElement.innerHTML =
    message;
}


/* =========================================================
   CAMERA STATUS
========================================================= */

function setCameraStatus(message) {

  cameraStatusElement.textContent =
    message;

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

  if (cameraRunning) {
    return;
  }

  try {

    showResult(
      "📷 Starting camera...",
      "loading"
    );

    setCameraStatus(
      "Requesting camera permission..."
    );

    qrScanner =
      new Html5Qrcode("reader");

    const config = {

      fps: 10,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const minSize =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          );

        return {

          width:
            Math.floor(
              minSize * 0.70
            ),

          height:
            Math.floor(
              minSize * 0.70
            )

        };

      },

      aspectRatio: 1.0

    };


    await qrScanner.start(

      {
        facingMode: {
          ideal: "environment"
        }
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    cameraRunning = true;

    setCameraStatus(
      "Camera started. Point it at the attendee's QR Code."
    );

    showResult(
      "Ready to scan...",
      "loading"
    );


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );

    cameraRunning = false;

    showResult(
      "❌ Unable to start camera.<br><br>" +
      "Please allow camera permission in Chrome.",
      "error"
    );

    setCameraStatus(
      "Camera permission may be blocked."
    );

  }

}


/* =========================================================
   STOP CAMERA
========================================================= */

async function stopCamera() {

  if (
    !qrScanner ||
    !cameraRunning
  ) {

    return;

  }

  try {

    await qrScanner.stop();

    qrScanner.clear();

    cameraRunning = false;

    setCameraStatus(
      "Camera stopped."
    );

    showResult(
      "Camera stopped.",
      "loading"
    );

  } catch (error) {

    console.error(
      "Stop camera error:",
      error
    );

  }

}


/* =========================================================
   QR SCAN SUCCESS
========================================================= */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (processingScan) {
    return;
  }

  if (!decodedText) {
    return;
  }

  processingScan = true;


  console.log(
    "QR detected:",
    decodedText
  );


  /*
     The QR contains something like:

     XO-0001
     XO-0002
     XO-0009

     We automatically send it to
     Google Apps Script.
  */

  showResult(
    "⏳ Confirming attendance...",
    "loading"
  );


  setCameraStatus(
    "QR detected. Checking attendance..."
  );


  /*
     Stop camera temporarily
     so the same QR doesn't get
     scanned multiple times.
  */

  if (
    qrScanner &&
    cameraRunning
  ) {

    qrScanner
      .pause(true);

  }


  sendAttendance(
    decodedText.trim()
  );

}


/* =========================================================
   QR SCAN FAILURE
========================================================= */

function onScanFailure(error) {

  /*
     Ignore normal scanning failures.

     html5-qrcode calls this repeatedly
     while it is looking for a QR code.
  */

}


/* =========================================================
   JSONP ATTENDANCE REQUEST
========================================================= */

function sendAttendance(
  qrId
) {

  /*
     IMPORTANT:

     We are NOT using fetch() here.

     GitHub Pages -> Google Apps Script
     can run into CORS restrictions.

     JSONP avoids that problem.
  */

  const callbackName =
    "xoAttendanceCallback_" +
    Date.now() +
    "_" +
    (++jsonpCounter);


  const script =
    document.createElement("script");


  const timeout =
    setTimeout(
      function() {

        cleanup();

        processingScan = false;

        if (
          qrScanner &&
          cameraRunning
        ) {

          try {
            qrScanner.resume();
          } catch (e) {}

        }

        showResult(
          "❌ Unable to connect to the attendance system.<br><br>" +
          "Please check the internet connection and try again.",
          "error"
        );

        setCameraStatus(
          "Connection failed. Please try scanning again."
        );

      },
      15000
    );


  window[callbackName] =
    function(response) {

      clearTimeout(timeout);

      cleanup();

      handleAttendanceResponse(
        response
      );

    };


  function cleanup() {

    clearTimeout(timeout);

    if (script.parentNode) {

      script.parentNode.removeChild(
        script
      );

    }

    try {

      delete window[
        callbackName
      ];

    } catch (e) {

      window[
        callbackName
      ] = undefined;

    }

  }


  const url =
    APPS_SCRIPT_URL +
    "?action=attendance" +
    "&qrId=" +
    encodeURIComponent(qrId) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();


  console.log(
    "Attendance request:",
    url
  );


  apiStatusElement.textContent =
    "Connecting to attendance system...";


  script.src = url;

  script.async = true;

  script.onerror =
    function() {

      clearTimeout(timeout);

      cleanup();

      processingScan = false;

      showResult(
        "❌ Unable to connect to the attendance system.<br><br>" +
        "Google Apps Script did not respond.",
        "error"
      );

      apiStatusElement.textContent =
        "Attendance system connection failed.";

      setCameraStatus(
        "Please try scanning again."
      );


      if (
        qrScanner &&
        cameraRunning
      ) {

        try {
          qrScanner.resume();
        } catch (e) {}

      }

    };


  document.body.appendChild(
    script
  );

}


/* =========================================================
   PROCESS ATTENDANCE RESPONSE
========================================================= */

function handleAttendanceResponse(
  response
) {

  console.log(
    "Attendance response:",
    response
  );


  processingScan = false;


  if (!response) {

    showResult(
      "❌ No response from attendance system.",
      "error"
    );

    return;

  }


  /* =====================================================
     SUCCESS
  ===================================================== */

  if (
    response.success === true
  ) {

    showResult(

      "🎉 ATTENDANCE CONFIRMED!<br><br>" +

      "<strong>" +
      escapeHtml(
        response.name || "Attendee"
      ) +
      "</strong><br><br>" +

      "QR ID: " +
      escapeHtml(
        response.qrId || ""
      ) +
      "<br><br>" +

      "Checked in at " +
      escapeHtml(
        response.time || ""
      ),

      "success"

    );


    apiStatusElement.textContent =
      "Attendance successfully recorded in Google Sheets.";

    setCameraStatus(
      "Attendance confirmed!"
    );


    /*
       Automatically resume camera
       after 3 seconds.
    */

    setTimeout(
      function() {

        if (
          qrScanner &&
          cameraRunning
        ) {

          try {

            qrScanner.resume();

            showResult(
              "Ready to scan next attendee...",
              "loading"
            );

            setCameraStatus(
              "Point the camera at the next QR Code."
            );

          } catch (error) {

            console.error(
              error
            );

          }

        }

      },
      3000
    );


    return;

  }


  /* =====================================================
     ALREADY PRESENT
  ===================================================== */

  if (
    response.alreadyPresent === true
  ) {

    showResult(

      "⚠️ ALREADY CHECKED IN<br><br>" +

      "<strong>" +
      escapeHtml(
        response.name || "Attendee"
      ) +
      "</strong><br><br>" +

      escapeHtml(
        response.message || ""
      ),

      "warning"

    );


    apiStatusElement.textContent =
      "This attendee is already marked PRESENT.";

    setCameraStatus(
      "Ready for the next attendee."
    );


    setTimeout(
      function() {

        if (
          qrScanner &&
          cameraRunning
        ) {

          try {

            qrScanner.resume();

            showResult(
              "Ready to scan next attendee...",
              "loading"
            );

          } catch (error) {}

        }

      },
      3000
    );


    return;

  }


  /* =====================================================
     ERROR
  ===================================================== */

  showResult(

    "❌ " +
    escapeHtml(
      response.message ||
      "Unable to process QR code."
    ),

    "error"

  );


  apiStatusElement.textContent =
    "Attendance system returned an error.";

  setCameraStatus(
    "Please try again."
  );


  setTimeout(
    function() {

      if (
        qrScanner &&
        cameraRunning
      ) {

        try {

          qrScanner.resume();

          showResult(
            "Ready to scan...",
            "loading"
          );

        } catch (error) {}

      }

    },
    3000
  );

}


/* =========================================================
   UPLOAD QR FROM GALLERY
========================================================= */

async function scanImage(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }


  try {

    /*
       If camera is running,
       temporarily stop it.
    */

    if (
      qrScanner &&
      cameraRunning
    ) {

      await qrScanner.stop();

      cameraRunning = false;

    }


    showResult(
      "⏳ Reading QR image...",
      "loading"
    );


    setCameraStatus(
      "Processing QR image..."
    );


    processingScan = false;


    const imageScanner =
      new Html5Qrcode(
        "reader"
      );


    const decodedText =
      await imageScanner.scanFile(
        file,
        true
      );


    await imageScanner.clear();


    if (!decodedText) {

      throw new Error(
        "QR code could not be read."
      );

    }


    onScanSuccess(
      decodedText,
      null
    );


  } catch (error) {

    console.error(
      "Image scan error:",
      error
    );


    processingScan = false;


    showResult(
      "❌ Unable to read the QR code from this image.",
      "error"
    );


    setCameraStatus(
      "Please upload a clearer QR image."
    );

  }


  /*
     Allow selecting the same image again.
  */

  event.target.value = "";

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener(
  "load",
  function() {

    console.log(
      "XO+ Attendance Scanner loaded."
    );

    console.log(
      "Apps Script URL:",
      APPS_SCRIPT_URL
    );

    apiStatusElement.textContent =
      "Attendance system ready.";

  }
);

</script>

</body>
</html>
