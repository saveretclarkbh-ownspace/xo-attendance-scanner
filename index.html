<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>XO+ Attendance Scanner</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 30px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 20px;
    }

    #cameraContainer {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
    }

    #video {
      width: 100%;
      display: block;
    }

    #scanBox {
      position: absolute;
      width: 250px;
      height: 250px;
      border: 3px solid white;
      border-radius: 15px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      font-size: 19px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px 22px;
      font-size: 17px;
      cursor: pointer;
      margin: 8px;
    }

    #startButton {
      background: #111;
      color: white;
    }

    #stopButton {
      background: #d93025;
      color: white;
    }

    #uploadButton {
      background: #1a73e8;
      color: white;
    }

    #uploadButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .success {
      color: #16803c;
      font-weight: bold;
    }

    .error {
      color: #d93025;
      font-weight: bold;
    }

    .checking {
      color: #555;
      font-weight: bold;
    }

    .name {
      font-size: 27px;
      margin: 12px 0;
    }

    .qrid {
      color: #666;
      font-size: 17px;
    }

    #status {
      margin-top: 10px;
      font-size: 15px;
      color: #666;
    }

    canvas {
      display: none;
    }

  </style>

</head>


<body>

  <h1>📱 XO+ Attendance</h1>

  <div class="subtitle">
    Scan the attendee's QR Code
  </div>


  <div id="cameraContainer">

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

    <div id="scanBox"></div>

  </div>


  <div>

    <button id="startButton">
      📷 Start Camera
    </button>

    <button id="stopButton">
      ⛔ Stop Camera
    </button>

  

    <button id="uploadButton" type="button">
      🖼️ Upload QR Code
    </button>

    <input
      id="qrFileInput"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
    >
</div>


  <div id="status">
    Camera not started.
  </div>


  <div id="result">
    Ready to scan...
  </div>


  <canvas id="canvas"></canvas>


<script>


/*
====================================================
GOOGLE APPS SCRIPT WEB APP
====================================================
*/

const API_URL =
  "https://script.google.com/macros/s/AKfycbx5BJw5IE7VtLSHOt5GjPbPfvn897a407iLhZ581s5kkWn8u3ztBzgG_pRmT0eAFvJf/exec";


/*
====================================================
ELEMENTS
====================================================
*/

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const result =
  document.getElementById("result");

const status =
  document.getElementById("status");

const startButton =
  document.getElementById("startButton");

const stopButton =
  document.getElementById("stopButton");

const uploadButton =
  document.getElementById("uploadButton");

const qrFileInput =
  document.getElementById("qrFileInput");


/*
====================================================
VARIABLES
====================================================
*/

let stream = null;

let scanning = false;

let processingQR = false;

let detector = null;


/*
====================================================
START CAMERA
====================================================
*/

async function startCamera() {

  try {

    status.textContent =
      "Requesting camera permission...";


    /*
    Check camera support
    */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Your browser does not support camera access."
      );

    }


    /*
    Request the BACK camera
    */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    /*
    Attach camera to video
    */

    video.srcObject = stream;


    await video.play();


    /*
    Check BarcodeDetector
    */

    if (
      "BarcodeDetector" in window
    ) {

      detector =
        new BarcodeDetector({
          formats: ["qr_code"]
        });

      status.textContent =
        "📷 Camera ready — point it at the QR code.";

      scanning = true;

      scanLoop();

    } else {

      status.textContent =
        "⚠️ Your browser does not support native QR scanning.";

      result.innerHTML =
        '<div class="error">' +
        'QR detection is not supported by this browser.' +
        '<br><br>' +
        'Please use a current Chrome browser.' +
        '</div>';

    }


  } catch (error) {

    console.error(error);


    status.textContent =
      "Camera permission failed.";


    let message =
      error.message;


    if (
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "Camera permission was denied. " +
        "Please allow camera access in your browser settings.";

    }


    if (
      error.name ===
      "NotFoundError"
    ) {

      message =
        "No camera was found on this device.";

    }


    if (
      error.name ===
      "NotReadableError"
    ) {

      message =
        "The camera is being used by another application.";

    }


    result.innerHTML =

      '<div class="error">' +

      '❌ ' +

      escapeHtml(message) +

      '<br><br>' +

      '<small>' +

      'Open your browser site settings and allow Camera.'

      +

      '</small>' +

      '</div>';

  }

}


/*
====================================================
SCAN LOOP
====================================================
*/

async function scanLoop() {

  if (!scanning) {
    return;
  }


  if (
    !detector ||
    video.readyState <
    HTMLMediaElement.HAVE_ENOUGH_DATA
  ) {

    requestAnimationFrame(scanLoop);

    return;

  }


  try {

    const barcodes =
      await detector.detect(video);


    if (
      barcodes &&
      barcodes.length > 0
    ) {

      const qrText =
        barcodes[0].rawValue;


      if (qrText) {

        handleQRCode(qrText);

      }

    }

  } catch (error) {

    console.log(
      "QR detection:",
      error
    );

  }


  requestAnimationFrame(scanLoop);

}


/*
====================================================
HANDLE QR CODE
====================================================
*/

function handleQRCode(qrText) {

  if (processingQR) {
    return;
  }


  const qrId =
    String(qrText).trim();


  /*
  Make sure this is our XO+ QR
  */

  if (
    !qrId.toUpperCase().startsWith("XO-")
  ) {

    result.innerHTML =

      '<div class="error">' +

      '⚠️ Invalid XO+ QR Code' +

      '</div>';


    return;

  }


  processingQR = true;


  /*
  Stop scanning temporarily
  */

  scanning = false;


  result.innerHTML =

    '<div class="checking">' +

    '⏳ Checking attendance...' +

    '<br><br>' +

    '<small>' +

    escapeHtml(qrId) +

    '</small>' +

    '</div>';


  sendAttendance(qrId);

}


/*
====================================================
SEND ATTENDANCE TO APPS SCRIPT
====================================================
*/

function sendAttendance(qrId) {

  const callbackName =
    "attendanceCallback_" + Date.now();

  let finished = false;

  const script = document.createElement("script");
  script.id = callbackName;
  script.async = true;

  function cleanup() {
    clearTimeout(timeout);

    try {
      delete window[callbackName];
    } catch (e) {}

    const oldScript =
      document.getElementById(callbackName);

    if (oldScript) {
      oldScript.remove();
    }
  }

  function finishAndResume() {
    setTimeout(function() {
      processingQR = false;
      result.innerHTML = "Ready for next attendee...";
      scanning = true;
    }, 3500);
  }

  const timeout = setTimeout(function() {

    if (finished) return;

    finished = true;

    console.error(
      "Apps Script request timed out:",
      script.src
    );

    cleanup();

    result.innerHTML =
      '<div class="error">' +
      '❌ Attendance system timeout.' +
      '<br><br>' +
      '<small>' +
      'The QR was detected, but Google Apps Script did not respond within 15 seconds.' +
      '<br><br>' +
      'Please check your internet connection and try again.' +
      '</small>' +
      '</div>';

    processingQR = false;

    setTimeout(function() {
      scanning = true;
    }, 3000);

  }, 15000);


  // JSONP callback from Google Apps Script
  window[callbackName] = function(response) {

    if (finished) return;

    finished = true;

    console.log(
      "Apps Script response:",
      response
    );

    cleanup();

    if (!response || typeof response !== "object") {

      result.innerHTML =
        '<div class="error">' +
        '❌ Invalid response from attendance system.' +
        '</div>';

      processingQR = false;

      setTimeout(function() {
        scanning = true;
      }, 3000);

      return;
    }


    // SUCCESS
    if (response.success === true) {

      result.innerHTML =
        '<div class="success">' +
        '🎉 ATTENDANCE CONFIRMED!' +

        '<div class="name">' +
        escapeHtml(response.name) +
        '</div>' +

        '<div class="qrid">' +
        escapeHtml(response.qrId) +
        '</div>' +

        '<br>' +

        '🕐 Checked in at ' +
        escapeHtml(response.time || "") +

        '<br><br>' +

        '<small>' +
        escapeHtml(
          response.message ||
          "Attendance recorded successfully."
        ) +
        '</small>' +

        '</div>';

      finishAndResume();
      return;
    }


    // ALREADY PRESENT
    if (response.alreadyPresent === true) {

      result.innerHTML =
        '<div class="error">' +
        '⚠️ ALREADY CHECKED IN' +

        '<div class="name">' +
        escapeHtml(response.name || "") +
        '</div>' +

        '<div class="qrid">' +
        escapeHtml(response.qrId || qrId) +
        '</div>' +

        '<br>' +

        escapeHtml(
          response.message ||
          "This attendee is already checked in."
        ) +

        '</div>';

      finishAndResume();
      return;
    }


    // OTHER API ERROR
    result.innerHTML =
      '<div class="error">' +
      '❌ ATTENDANCE NOT RECORDED' +
      '<br><br>' +
      escapeHtml(
        response.message ||
        "The attendance request was rejected."
      ) +
      '</div>';

    finishAndResume();
  };


  // JSONP request
  script.src =
    API_URL +
    "?action=attendance" +
    "&qrId=" +
    encodeURIComponent(qrId) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();

  console.log(
    "Sending attendance request:",
    script.src
  );


  // Network / script loading error
  script.onerror = function() {

    if (finished) return;

    finished = true;

    console.error(
      "Apps Script connection failed:",
      script.src
    );

    cleanup();

    result.innerHTML =
      '<div class="error">' +
      '❌ Unable to connect to attendance system.' +
      '<br><br>' +
      '<small>' +
      'The QR was detected, but the Apps Script API could not be loaded.' +
      '<br><br>' +
      'Please check the Apps Script Web App deployment.' +
      '</small>' +
      '</div>';

    processingQR = false;

    setTimeout(function() {
      scanning = true;
    }, 3000);
  };


  document.body.appendChild(script);
}

/*
====================================================
UPLOAD QR CODE
====================================================
*/

async function uploadQRCode(file) {

  if (!file) return;

  if (processingQR) {
    result.innerHTML =
      '<div class="checking">' +
      '⏳ Please wait for the current attendance check to finish.' +
      '</div>';
    return;
  }

  processingQR = true;
  scanning = false;
  uploadButton.disabled = true;

  status.textContent =
    "Reading uploaded QR image...";

  result.innerHTML =
    '<div class="checking">' +
    '⏳ Reading QR code...' +
    '<br><br><small>Please wait.</small>' +
    '</div>';

  try {

    if (!("BarcodeDetector" in window)) {
      throw new Error(
        "QR image scanning is not supported by this browser. Please use a current Chrome browser or use the camera scanner."
      );
    }

    const imageDetector =
      new BarcodeDetector({
        formats: ["qr_code"]
      });

    let imageSource;

    try {
      imageSource = await createImageBitmap(file);
    } catch (e) {
      imageSource = await loadImageFromFile(file);
    }

    const barcodes =
      await imageDetector.detect(imageSource);

    if (
      imageSource &&
      typeof imageSource.close === "function"
    ) {
      imageSource.close();
    }

    if (!barcodes || barcodes.length === 0) {
      throw new Error(
        "No QR code was found in that image. Please upload a clear QR code image."
      );
    }

    const qrText =
      String(barcodes[0].rawValue || "").trim();

    const qrId =
      extractXOQrId(qrText);

    if (!qrId) {
      throw new Error(
        "This is not a valid XO+ QR code. The QR must contain an XO ID such as XO-0001."
      );
    }

    result.innerHTML =
      '<div class="checking">' +
      '⏳ Checking attendance...' +
      '<br><br><small>' +
      escapeHtml(qrId) +
      '</small></div>';

    sendAttendance(qrId);

  } catch (error) {

    console.error("Uploaded QR error:", error);

    result.innerHTML =
      '<div class="error">' +
      '❌ Unable to read QR code' +
      '<br><br><small>' +
      escapeHtml(
        error.message ||
        "Please upload a clear QR code image."
      ) +
      '</small></div>';

    processingQR = false;

    setTimeout(function() {
      scanning = true;
    }, 3000);

  } finally {

    uploadButton.disabled = false;
    qrFileInput.value = "";
  }
}


/*
====================================================
LOAD IMAGE FILE
====================================================
*/

function loadImageFromFile(file) {

  return new Promise(function(resolve, reject) {

    const url = URL.createObjectURL(file);
    const image = new Image();

    image.onload = function() {
      URL.revokeObjectURL(url);
      resolve(image);
    };

    image.onerror = function() {
      URL.revokeObjectURL(url);
      reject(
        new Error("The uploaded image could not be opened.")
      );
    };

    image.src = url;
  });
}


/*
====================================================
EXTRACT XO QR ID
====================================================
*/

function extractXOQrId(value) {

  const text = String(value || "").trim();
  const match = text.match(/XO-\d{1,8}/i);

  return match
    ? match[0].toUpperCase()
    : null;
}


/*
====================================================
STOP CAMERA
====================================================
*/

function stopCamera() {

  scanning = false;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );

    stream = null;

  }


  video.srcObject = null;


  status.textContent =
    "Camera stopped.";

}


/*
====================================================
ESCAPE HTML
====================================================
*/

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value == null
      ? ""
      : value;

  return div.innerHTML;

}


/*
====================================================
BUTTONS
====================================================
*/

startButton.addEventListener(
  "click",
  startCamera
);


stopButton.addEventListener(
  "click",
  stopCamera
);

uploadButton.addEventListener(
  "click",
  function() {
    qrFileInput.click();
  }
);

qrFileInput.addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files &&
      event.target.files[0];

    uploadQRCode(file);
  }
);


</script>

</body>

</html>
