<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>XO+ Attendance Scanner</title>

  <!-- QR SCANNER LIBRARY -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      text-align: center;
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 32px;
    }

    .subtitle {
      font-size: 18px;
      color: #555;
      margin-bottom: 20px;
    }

    /* CAMERA */
    #reader {
      width: 100%;
      max-width: 520px;
      margin: 0 auto 20px;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      min-height: 300px;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      object-fit: cover;
    }

    #reader__scan_region {
      background: #000 !important;
    }

    #reader__dashboard {
      display: none !important;
    }

    /* STATUS */
    #status {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin: 15px 0;
      font-size: 18px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ready {
      color: #444;
    }

    .loading {
      color: #555;
    }

    .success {
      color: #16803c;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .warning {
      color: #a05a00;
      font-weight: bold;
    }

    /* BUTTONS */
    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 17px;
      margin: 7px 0;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #e51b23;
      color: white;
    }

    #stopButton {
      background: #eeeeee;
      color: #222;
    }

    #uploadButton {
      background: white;
      color: #c62828;
      border: 2px solid #c62828;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* MANUAL */
    .manual-box {
      margin-top: 20px;
      background: white;
      padding: 18px;
      border-radius: 15px;
    }

    .manual-box h3 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 18px;
      text-align: center;
      text-transform: uppercase;
    }

    #manualButton {
      background: #333;
      color: white;
    }

    .small {
      margin-top: 15px;
      font-size: 13px;
      color: #777;
      line-height: 1.5;
    }

    /* ATTENDEE RESULT */
    #attendee {
      display: none;
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-top: 15px;
    }

    #attendeeName {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #attendeeQR {
      font-size: 17px;
      color: #666;
    }

    #attendeeTime {
      margin-top: 8px;
      font-size: 17px;
    }

    /* HIDE FILE INPUT */
    #qrFile {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📱 XO+ Attendance</h1>

  <div class="subtitle">
    Scan the attendee's QR Code
  </div>

  <!-- QR CAMERA -->
  <div id="reader"></div>

  <!-- STATUS -->
  <div id="status" class="ready">
    Ready to scan...
  </div>

  <!-- RESULT -->
  <div id="attendee">

    <div id="attendeeName"></div>

    <div id="attendeeQR"></div>

    <div id="attendeeTime"></div>

  </div>

  <!-- CAMERA BUTTONS -->
  <button
    id="startButton"
    onclick="startCamera()"
  >
    📷 Start Camera
  </button>

  <button
    id="stopButton"
    onclick="stopCamera()"
  >
    ⏹ Stop Camera
  </button>

  <!-- UPLOAD QR -->
  <button
    id="uploadButton"
    onclick="document.getElementById('qrFile').click()"
  >
    🖼️ Upload QR from Gallery
  </button>

  <input
    type="file"
    id="qrFile"
    accept="image/*"
  >

  <!-- MANUAL FALLBACK -->
  <div class="manual-box">

    <h3>🔢 Manual QR ID</h3>

    <input
      type="text"
      id="manualQr"
      placeholder="Example: XO-0009"
      autocomplete="off"
    >

    <button
      id="manualButton"
      onclick="manualAttendance()"
    >
      Confirm Attendance
    </button>

  </div>

  <div class="small">
    Make sure the entire QR code is visible inside the scanning box.
    <br>
    For best results, keep the QR steady and well lit.
  </div>

</div>

<script>

  /* =====================================================
     CONFIGURATION
  ===================================================== */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzYA1CGoyrkixzPsyCkZk2IuevMRUwhK36FuX4K-5lH9tjyW7twbfURhETc8bEWtHG9/exec";


  /* =====================================================
     GLOBAL VARIABLES
  ===================================================== */

  let html5QrCode = null;

  let cameraRunning = false;

  let processingScan = false;

  let currentCameraId = null;


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const statusBox =
    document.getElementById("status");

  const attendeeBox =
    document.getElementById("attendee");

  const attendeeName =
    document.getElementById("attendeeName");

  const attendeeQR =
    document.getElementById("attendeeQR");

  const attendeeTime =
    document.getElementById("attendeeTime");


  /* =====================================================
     STATUS MESSAGE
  ===================================================== */

  function setStatus(
    message,
    type = "ready"
  ) {

    statusBox.className = type;

    statusBox.innerHTML = message;

  }


  /* =====================================================
     FIND REAR CAMERA
  ===================================================== */

  async function findRearCamera() {

    const cameras =
      await Html5Qrcode.getCameras();

    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "No camera was found on this device."
      );

    }

    /*
      Prefer cameras with names such as:
      Back
      Rear
      Environment
    */

    const rearCamera =
      cameras.find(
        camera => {

          const label =
            camera.label.toLowerCase();

          return (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment")
          );

        }
      );

    return rearCamera
      ? rearCamera.id
      : cameras[cameras.length - 1].id;

  }


  /* =====================================================
     START CAMERA
  ===================================================== */

  async function startCamera() {

    if (cameraRunning) {

      setStatus(
        "📷 Camera is already running.",
        "ready"
      );

      return;

    }

    try {

      setStatus(
        "⏳ Requesting camera...",
        "loading"
      );

      /*
        Request camera permission and
        identify the rear camera.
      */

      currentCameraId =
        await findRearCamera();


      if (!html5QrCode) {

        html5QrCode =
          new Html5Qrcode(
            "reader"
          );

      }


      await html5QrCode.start(

        currentCameraId,

        {
          fps: 15,

          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            /*
              Create a large square scanning
              area that works better on phones.
            */

            const minSize =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              );

            const size =
              Math.floor(
                minSize * 0.72
              );

            return {
              width: size,
              height: size
            };

          },

          aspectRatio: 1.0,

          disableFlip: false

        },

        onScanSuccess,

        onScanFailure

      );


      cameraRunning = true;

      setStatus(
        "📷 Camera started. Point it at the QR code.",
        "ready"
      );

    }
    catch (error) {

      console.error(
        "Camera error:",
        error
      );

      cameraRunning = false;

      setStatus(
        "❌ Camera could not start.<br><br>" +
        "Please allow camera permission for this website.",
        "error"
      );

    }

  }


  /* =====================================================
     STOP CAMERA
  ===================================================== */

  async function stopCamera() {

    if (
      !html5QrCode ||
      !cameraRunning
    ) {

      return;

    }

    try {

      await html5QrCode.stop();

      cameraRunning = false;

      setStatus(
        "⏹ Camera stopped.",
        "ready"
      );

    }
    catch (error) {

      console.error(
        "Stop camera error:",
        error
      );

      cameraRunning = false;

    }

  }


  /* =====================================================
     QR SCAN SUCCESS
  ===================================================== */

  async function onScanSuccess(
    decodedText,
    decodedResult
  ) {

    /*
      Prevent the same QR from being
      processed many times per second.
    */

    if (processingScan) {

      return;

    }

    processingScan = true;


    const qrId =
      String(
        decodedText
      ).trim();


    console.log(
      "QR DETECTED:",
      qrId
    );


    setStatus(
      "⏳ QR detected: <strong>" +
      escapeHtml(qrId) +
      "</strong><br>Checking attendance...",
      "loading"
    );


    /*
      Stop camera temporarily so the
      same QR isn't scanned repeatedly.
    */

    try {

      if (
        html5QrCode &&
        cameraRunning
      ) {

        await html5QrCode.stop();

        cameraRunning = false;

      }

    }
    catch (error) {

      console.log(
        "Camera stop warning:",
        error
      );

    }


    /*
      Send QR ID to Apps Script.
    */

    sendAttendance(
      qrId
    );

  }


  /* =====================================================
     QR SCAN FAILURE
  ===================================================== */

  function onScanFailure(
    errorMessage
  ) {

    /*
      Ignore normal scanning failures.

      The library calls this continuously
      while looking for a QR code.
    */

  }


  /* =====================================================
     SEND ATTENDANCE
     JSONP VERSION
  ===================================================== */

  function sendAttendance(
    qrId
  ) {

    const callbackName =
      "attendanceCallback_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );


    const script =
      document.createElement(
        "script"
      );


    /*
      Create temporary global callback.
    */

    window[callbackName] =
      function(response) {

        try {

          console.log(
            "Attendance response:",
            response
          );


          if (
            response &&
            response.success
          ) {

            showSuccess(
              response
            );

          }
          else if (
            response &&
            response.alreadyPresent
          ) {

            showAlreadyPresent(
              response
            );

          }
          else {

            showError(
              response &&
              response.message
                ? response.message
                : "Unable to process attendance."
            );

          }

        }
        catch (error) {

          console.error(
            error
          );

          showError(
            "Unable to process the attendance response."
          );

        }


        /*
          Clean up callback and script.
        */

        delete window[callbackName];

        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        /*
          Allow another scan.
        */

        setTimeout(
          function() {

            processingScan =
              false;

            startCamera();

          },
          2500
        );

      };


    /*
      JSONP request to Apps Script.
    */

    const url =
      API_URL +
      "?action=attendance" +
      "&qrId=" +
      encodeURIComponent(
        qrId
      ) +
      "&callback=" +
      encodeURIComponent(
        callbackName
      ) +
      "&t=" +
      Date.now();


    script.src = url;


    /*
      Handle network/script errors.
    */

    script.onerror =
      function() {

        console.error(
          "Unable to connect to Apps Script."
        );


        showError(
          "Unable to connect to the attendance system."
        );


        delete window[callbackName];

        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        setTimeout(
          function() {

            processingScan =
              false;

            startCamera();

          },
          2500
        );

      };


    document.body.appendChild(
      script
    );


    /*
      Safety timeout.
    */

    setTimeout(
      function() {

        if (
          window[callbackName]
        ) {

          showError(
            "The attendance system took too long to respond."
          );

          delete window[callbackName];

          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );

          }


          processingScan =
            false;

          startCamera();

        }

      },
      15000
    );

  }


  /* =====================================================
     SUCCESS
  ===================================================== */

  function showSuccess(
    response
  ) {

    attendeeBox.style.display =
      "block";


    attendeeName.innerHTML =
      "🎉 " +
      escapeHtml(
        response.name ||
        "Attendee"
      );


    attendeeQR.innerHTML =
      "QR ID: <strong>" +
      escapeHtml(
        response.qrId ||
        ""
      ) +
      "</strong>";


    attendeeTime.innerHTML =
      "🕐 Checked in at " +
      escapeHtml(
        response.time ||
        ""
      );


    setStatus(
      "✅ ATTENDANCE CONFIRMED!",
      "success"
    );

  }


  /* =====================================================
     ALREADY PRESENT
  ===================================================== */

  function showAlreadyPresent(
    response
  ) {

    attendeeBox.style.display =
      "block";


    attendeeName.innerHTML =
      "⚠️ " +
      escapeHtml(
        response.name ||
        "Attendee"
      );


    attendeeQR.innerHTML =
      "QR ID: <strong>" +
      escapeHtml(
        response.qrId ||
        ""
      ) +
      "</strong>";


    attendeeTime.innerHTML =
      "";


    setStatus(
      "⚠️ " +
      escapeHtml(
        response.message ||
        "This attendee is already checked in."
      ),
      "warning"
    );

  }


  /* =====================================================
     ERROR
  ===================================================== */

  function showError(
    message
  ) {

    attendeeBox.style.display =
      "none";


    setStatus(
      "❌ " +
      escapeHtml(
        message
      ),
      "error"
    );

  }


  /* =====================================================
     MANUAL ATTENDANCE
  ===================================================== */

  function manualAttendance() {

    if (processingScan) {

      return;

    }


    const input =
      document.getElementById(
        "manualQr"
      );


    const qrId =
      input.value
        .trim()
        .toUpperCase();


    if (!qrId) {

      setStatus(
        "⚠️ Enter a QR ID first. Example: XO-0009",
        "warning"
      );

      return;

    }


    /*
      Basic validation.
    */

    if (
      !/^XO-\d{4}$/i.test(
        qrId
      )
    ) {

      setStatus(
        "⚠️ Invalid QR ID. Use a format like XO-0009.",
        "warning"
      );

      return;

    }


    processingScan =
      true;


    setStatus(
      "⏳ Checking " +
      escapeHtml(qrId) +
      "...",
      "loading"
    );


    sendAttendance(
      qrId
    );

  }


  /* =====================================================
     ENTER KEY FOR MANUAL ID
  ===================================================== */

  document
    .getElementById(
      "manualQr"
    )
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Enter"
        ) {

          manualAttendance();

        }

      }
    );


  /* =====================================================
     GALLERY QR SCANNING
  ===================================================== */

  document
    .getElementById(
      "qrFile"
    )
    .addEventListener(
      "change",
      async function(event) {

        const file =
          event.target.files[0];


        if (!file) {

          return;

        }


        if (processingScan) {

          return;

        }


        processingScan =
          true;


        setStatus(
          "⏳ Reading QR image...",
          "loading"
        );


        try {

          if (!html5QrCode) {

            html5QrCode =
              new Html5Qrcode(
                "reader"
              );

          }


          const decodedText =
            await html5QrCode.scanFile(
              file,
              true
            );


          const qrId =
            String(
              decodedText
            ).trim();


          console.log(
            "IMAGE QR DETECTED:",
            qrId
          );


          setStatus(
            "✅ QR detected: " +
            escapeHtml(qrId) +
            "<br>Checking attendance...",
            "loading"
          );


          sendAttendance(
            qrId
          );

        }
        catch (error) {

          console.error(
            "Image QR error:",
            error
          );


          processingScan =
            false;


          setStatus(
            "❌ Unable to read the QR image.<br>" +
            "Please use a clearer QR image or use the camera.",
            "error"
          );

        }


        /*
          Reset file input so the
          same image can be selected again.
        */

        event.target.value =
          "";

      }
    );


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHtml(
    value
  ) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      String(
        value
      );

    return div.innerHTML;

  }


  /* =====================================================
     INITIAL MESSAGE
  ===================================================== */

  setStatus(
    "Ready to scan...",
    "ready"
  );

</script>

</body>
</html>
