<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>XO+ Attendance Scanner</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --purple: #5b3b8f;
      --purple-dark: #432b6b;
      --blue: #2563eb;
      --red: #dc2626;
      --green: #16803c;
      --text: #171717;
      --muted: #6b7280;
      --card: rgba(255,255,255,0.94);
      --shadow: 0 18px 45px rgba(30, 20, 60, 0.12);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px 40px;
      font-family: Arial, sans-serif;
      text-align: center;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, rgba(91,59,143,0.14), transparent 30%),
        radial-gradient(circle at 100% 15%, rgba(37,99,235,0.10), transparent 28%),
        linear-gradient(180deg, #f8f7fb 0%, #eef2f7 100%);
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 4px 0 6px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 38px);
      letter-spacing: -0.7px;
      font-weight: 800;
    }

    .brand-image {
      width: 100%;
      max-width: 520px;
      margin: 0 auto 8px;
      overflow: hidden;
      border-radius: 14px;
    }

    .brand-logo-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 125px;
      object-fit: contain;
      margin: 0 auto;
    }

    .brand-icon {
      font-size: 30px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 22px;
      font-size: 16px;
    }

    #cameraContainer {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: #050505;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow);
      border: 4px solid rgba(255,255,255,0.85);
    }

    #video {
      width: 100%;
      min-height: 300px;
      display: block;
      object-fit: cover;
    }

    #scanBox {
      position: absolute;
      width: min(65vw, 270px);
      height: min(65vw, 270px);
      border: 3px solid rgba(255,255,255,0.95);
      border-radius: 22px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow:
        0 0 0 9999px rgba(0,0,0,0.18),
        0 0 24px rgba(255,255,255,0.20);
    }

    #scanBox::after {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      top: 50%;
      height: 2px;
      background: rgba(255,255,255,0.75);
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin: 20px auto 14px;
      max-width: 520px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 15px 18px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 7px 18px rgba(0,0,0,0.10);
    }

    button:active {
      transform: scale(0.98);
    }

    #startButton {
      background: linear-gradient(135deg, #111827, #2d2d35);
      color: white;
    }

    #stopButton {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: white;
    }

    #uploadButton {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
    }

    #uploadButton:disabled,
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin: 8px 0 14px;
      font-size: 15px;
      color: var(--muted);
      min-height: 20px;
    }

    #result {
      max-width: 520px;
      min-height: 92px;
      margin: 0 auto;
      padding: 24px 20px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 22px;
      font-size: 18px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
    }

    .result-idle {
      color: #4b5563;
      font-weight: 600;
    }

    .success {
      color: var(--green);
      font-weight: 800;
    }

    .error {
      color: var(--red);
      font-weight: 800;
    }

    .checking {
      color: #4b5563;
      font-weight: 700;
    }

    .name {
      font-size: clamp(24px, 6vw, 31px);
      line-height: 1.12;
      margin: 12px 0;
      color: var(--text);
    }

    .qrid {
      color: #6b7280;
      font-size: 16px;
      font-weight: 600;
    }

    small {
      line-height: 1.5;
    }

    canvas {
      display: none;
    }

    /* Attendance confirmation modal */
    #attendanceModal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(17, 12, 28, 0.72);
      backdrop-filter: blur(8px);
    }

    #attendanceModal.show {
      display: flex;
      animation: modalFadeIn 0.22s ease-out;
    }

    .attendance-card {
      width: min(100%, 440px);
      position: relative;
      overflow: hidden;
      padding: 30px 24px 24px;
      border-radius: 30px;
      background: #fff;
      box-shadow: 0 28px 80px rgba(0,0,0,0.28);
      text-align: center;
      animation: cardPop 0.25s ease-out;
    }

    .success-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #dcfce7;
      color: #15803d;
      font-size: 42px;
      font-weight: 900;
    }

    .attendance-title {
      margin: 0;
      color: #15803d;
      font-size: 27px;
      font-weight: 900;
    }

    .attendance-name {
      margin: 12px 0 5px;
      font-size: clamp(21px, 5.5vw, 31px);
      line-height: 1.18;
      font-weight: 800;
      color: #111827;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .attendance-qr {
      color: #6b7280;
      font-size: 16px;
      font-weight: 700;
    }

    .attendance-time {
      margin: 16px 0;
      padding: 12px;
      border-radius: 14px;
      background: #f3f4f6;
      color: #374151;
      font-weight: 700;
    }

    .confirmation-message {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.45;
      margin: 12px 0 18px;
    }

    .countdown-wrap {
      margin: 0 0 16px;
    }

    .countdown-label {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .countdown {
      font-size: 14px;
      font-weight: 800;
      color: var(--purple);
    }

    .progress-track {
      height: 7px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: #e5e7eb;
    }

    #confirmationProgress {
      width: 100%;
      height: 100%;
      transform-origin: left center;
      background: linear-gradient(90deg, #5b3b8f, #2563eb);
      border-radius: inherit;
    }

    #closeAttendanceButton {
      margin: 0;
      background: linear-gradient(135deg, #5b3b8f, #432b6b);
      color: white;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes cardPop {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (min-width: 620px) {
      .controls {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }

      button {
        margin: 0;
      }
    }

  </style>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>

const stopButton =
  document.getElementById("stopButton");

const uploadButton =
  document.getElementById("uploadButton");

const qrFileInput =
  document.getElementById("qrFileInput");

const attendanceModal =
  document.getElementById("attendanceModal");

const attendanceName =
  document.getElementById("attendanceName");

const attendanceQr =
  document.getElementById("attendanceQr");

const attendanceTime =
  document.getElementById("attendanceTime");

const attendanceMessage =
  document.getElementById("attendanceMessage");

const confirmationCountdown =
  document.getElementById("confirmationCountdown");

const confirmationProgress =
  document.getElementById("confirmationProgress");

const closeAttendanceButton =
  document.getElementById("closeAttendanceButton");


/*
====================================================
VARIABLES
====================================================
*/

let stream = null;

let scanning = false;

let processingQR = false;

let detector = null;

let confirmationTimer = null;
let confirmationEndTime = 0;


/*
====================================================
START CAMERA
====================================================
*/

async function startCamera() {

  try {

    status.textContent =
      "Requesting camera permission...";


    /*
    Check camera support
    */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Your browser does not support camera access."
      );

    }


    /*
    Request the BACK camera
    */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    /*
    Attach camera to video
    */

    video.srcObject = stream;


    await video.play();


    /*
    Check BarcodeDetector
    */

    if (
      "BarcodeDetector" in window
    ) {

      detector =
        new BarcodeDetector({
          formats: ["qr_code"]
        });

      status.textContent =
        "📷 Camera ready — point it at the QR code.";

      scanning = true;

      scanLoop();

    } else {

      status.textContent =
        "⚠️ Your browser does not support native QR scanning.";

      result.innerHTML =
        '<div class="error">' +
        'QR detection is not supported by this browser.' +
        '<br><br>' +
        'Please use a current Chrome browser.' +
        '</div>';

    }


  } catch (error) {

    console.error(error);


    status.textContent =
      "Camera permission failed.";


    let message =
      error.message;


    if (
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "Camera permission was denied. " +
        "Please allow camera access in your browser settings.";

    }


    if (
      error.name ===
      "NotFoundError"
    ) {

      message =
        "No camera was found on this device.";

    }


    if (
      error.name ===
      "NotReadableError"
    ) {

      message =
        "The camera is being used by another application.";

    }


    result.innerHTML =

      '<div class="error">' +

      '❌ ' +

      escapeHtml(message) +

      '<br><br>' +

      '<small>' +

      'Open your browser site settings and allow Camera.'

      +

      '</small>' +

      '</div>';

  }

}


/*
====================================================
SCAN LOOP
====================================================
*/

async function scanLoop() {

  if (!scanning) {
    return;
  }


  if (
    !detector ||
    video.readyState <
    HTMLMediaElement.HAVE_ENOUGH_DATA
  ) {

    requestAnimationFrame(scanLoop);

    return;

  }


  try {

    const barcodes =
      await detector.detect(video);


    if (
      barcodes &&
      barcodes.length > 0
    ) {

      const qrText =
        barcodes[0].rawValue;


      if (qrText) {

        handleQRCode(qrText);

      }

    }

  } catch (error) {

    console.log(
      "QR detection:",
      error
    );

  }


  requestAnimationFrame(scanLoop);

}


/*
====================================================
HANDLE QR CODE
====================================================
*/

function handleQRCode(qrText) {

  if (processingQR) {
    return;
  }


  const qrId =
    String(qrText).trim();


  /*
  Make sure this is our XO+ QR
  */

  if (
    !qrId.toUpperCase().startsWith("XO-")
  ) {

    result.innerHTML =

      '<div class="error">' +

      '⚠️ Invalid XO+ QR Code' +

      '</div>';


    return;

  }


  processingQR = true;


  /*
  Stop scanning temporarily
  */

  scanning = false;


  result.innerHTML =

    '<div class="checking">' +

    '⏳ Checking attendance...' +

    '<br><br>' +

    '<small>' +

    escapeHtml(qrId) +

    '</small>' +

    '</div>';


  sendAttendance(qrId);

}


/*
====================================================
SEND ATTENDANCE TO APPS SCRIPT
====================================================
*/

function showAttendanceConfirmation(response) {

  clearInterval(confirmationTimer);

  const fullName =
    String(
      response.fullName ||
      response.name ||
      "Attendee"
    ).trim();

  attendanceName.textContent =
    fullName;

  attendanceQr.textContent =
    response.qrId || "";

  attendanceTime.textContent =
    "🕐 Checked in at " +
    (response.time || "--");

  attendanceMessage.textContent =
    response.message ||
    "Attendance recorded successfully.";

  attendanceModal.classList.add("show");

  confirmationEndTime =
    Date.now() + 60000;

  confirmationProgress.style.transform =
    "scaleX(1)";

  updateConfirmationCountdown();

  confirmationTimer =
    setInterval(
      updateConfirmationCountdown,
      250
    );
}


function updateConfirmationCountdown() {

  const remainingMs =
    Math.max(
      0,
      confirmationEndTime - Date.now()
    );

  const remainingSeconds =
    Math.ceil(remainingMs / 1000);

  confirmationCountdown.textContent =
    remainingSeconds +
    (remainingSeconds === 1
      ? " second"
      : " seconds");

  confirmationProgress.style.transform =
    "scaleX(" +
    (remainingMs / 60000) +
    ")";

  if (remainingMs <= 0) {
    closeAttendanceConfirmation();
  }
}


function closeAttendanceConfirmation() {

  clearInterval(confirmationTimer);
  confirmationTimer = null;

  attendanceModal.classList.remove("show");

  processingQR = false;

  result.innerHTML =
    '<div class="result-idle">' +
    'Ready for next attendee...' +
    '</div>';

  scanning = true;
}


closeAttendanceButton.addEventListener(
  "click",
  closeAttendanceConfirmation
);

attendanceModal.addEventListener(
  "click",
  function(event) {
    if (event.target === attendanceModal) {
      closeAttendanceConfirmation();
    }
  }
);

document.addEventListener(
  "keydown",
  function(event) {
    if (
      event.key === "Escape" &&
      attendanceModal.classList.contains("show")
    ) {
      closeAttendanceConfirmation();
    }
  }
);


function sendAttendance(qrId) {

  const callbackName =
    "attendanceCallback_" + Date.now();

  let finished = false;

  const script = document.createElement("script");
  script.id = callbackName;
  script.async = true;

  function cleanup() {
    clearTimeout(timeout);

    try {
      delete window[callbackName];
    } catch (e) {}

    const oldScript =
      document.getElementById(callbackName);

    if (oldScript) {
      oldScript.remove();
    }
  }

  function finishAndResume() {
    processingQR = false;
    scanning = false;
  }

  const timeout = setTimeout(function() {

    if (finished) return;

    finished = true;

    console.error(
      "Apps Script request timed out:",
      script.src
    );

    cleanup();

    result.innerHTML =
      '<div class="error">' +
      '❌ Attendance system timeout.' +
      '<br><br>' +
      '<small>' +
      'The QR was detected, but Google Apps Script did not respond within 15 seconds.' +
      '<br><br>' +
      'Please check your internet connection and try again.' +
      '</small>' +
      '</div>';

    processingQR = false;

    setTimeout(function() {
      scanning = true;
    }, 3000);

  }, 15000);


  // JSONP callback from Google Apps Script
  window[callbackName] = function(response) {

    if (finished) return;

    finished = true;

    console.log(
      "Apps Script response:",
      response
    );

    cleanup();

    if (!response || typeof response !== "object") {

      result.innerHTML =
        '<div class="error">' +
        '❌ Invalid response from attendance system.' +
        '</div>';

      processingQR = false;

      setTimeout(function() {
        scanning = true;
      }, 3000);

      return;
    }


    // SUCCESS
    if (response.success === true) {

      showAttendanceConfirmation(response);

      finishAndResume();
      return;
    }


    // ALREADY PRESENT
    if (response.alreadyPresent === true) {

      result.innerHTML =
        '<div class="error">' +
        '⚠️ ALREADY CHECKED IN' +

        '<div class="name">' +
        escapeHtml(response.name || "") +
        '</div>' +

        '<div class="qrid">' +
        escapeHtml(response.qrId || qrId) +
        '</div>' +

        '<br>' +

        escapeHtml(
          response.message ||
          "This attendee is already checked in."
        ) +

        '</div>';

      finishAndResume();
      return;
    }


    // OTHER API ERROR
    result.innerHTML =
      '<div class="error">' +
      '❌ ATTENDANCE NOT RECORDED' +
      '<br><br>' +
      escapeHtml(
        response.message ||
        "The attendance request was rejected."
      ) +
      '</div>';

    finishAndResume();
  };


  // JSONP request
  script.src =
    API_URL +
    "?action=attendance" +
    "&qrId=" +
    encodeURIComponent(qrId) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();

  console.log(
    "Sending attendance request:",
    script.src
  );


  // Network / script loading error
  script.onerror = function() {

    if (finished) return;

    finished = true;

    console.error(
      "Apps Script connection failed:",
      script.src
    );

    cleanup();

    result.innerHTML =
      '<div class="error">' +
      '❌ Unable to connect to attendance system.' +
      '<br><br>' +
      '<small>' +
      'The QR was detected, but the Apps Script API could not be loaded.' +
      '<br><br>' +
      'Please check the Apps Script Web App deployment.' +
      '</small>' +
      '</div>';

    processingQR = false;

    setTimeout(function() {
      scanning = true;
    }, 3000);
  };


  document.body.appendChild(script);
}

/*
====================================================
UPLOAD QR CODE
====================================================
*/

async function uploadQRCode(file) {

  if (!file) return;

  if (processingQR) {
    result.innerHTML =
      '<div class="checking">' +
      '⏳ Please wait for the current attendance check to finish.' +
      '</div>';
    return;
  }

  processingQR = true;
  scanning = false;
  uploadButton.disabled = true;

  status.textContent =
    "Reading uploaded QR image...";

  result.innerHTML =
    '<div class="checking">' +
    '⏳ Reading QR code...' +
    '<br><br><small>Please wait.</small>' +
    '</div>';

  try {

    if (typeof jsQR !== "function") {
      throw new Error(
        "The QR image scanner could not load. Please check your internet connection and try again."
      );
    }

    const image =
      await loadImageFromFile(file);

    const canvas =
      document.createElement("canvas");

    const ctx =
      canvas.getContext("2d", {
        willReadFrequently: true
      });

    if (!ctx) {
      throw new Error(
        "Your browser could not prepare the uploaded image."
      );
    }

    // Keep the image large enough for QR detection,
    // but avoid creating an unnecessarily huge canvas.
    const maxSize = 1800;

    let width = image.naturalWidth || image.width;
    let height = image.naturalHeight || image.height;

    if (!width || !height) {
      throw new Error(
        "The uploaded image has no readable dimensions."
      );
    }

    const scale =
      Math.min(
        1,
        maxSize / Math.max(width, height)
      );

    width = Math.round(width * scale);
    height = Math.round(height * scale);

    canvas.width = width;
    canvas.height = height;

    ctx.drawImage(
      image,
      0,
      0,
      width,
      height
    );

    const imageData =
      ctx.getImageData(
        0,
        0,
        width,
        height
      );

    let code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );

    // Some phone photos have the QR small in the frame.
    // Try a centered crop if the full image did not decode.
    if (!code) {

      const cropSize =
        Math.min(width, height);

      const cropX =
        Math.floor((width - cropSize) / 2);

      const cropY =
        Math.floor((height - cropSize) / 2);

      const cropCanvas =
        document.createElement("canvas");

      cropCanvas.width = cropSize;
      cropCanvas.height = cropSize;

      const cropCtx =
        cropCanvas.getContext("2d", {
          willReadFrequently: true
        });

      cropCtx.drawImage(
        canvas,
        cropX,
        cropY,
        cropSize,
        cropSize,
        0,
        0,
        cropSize,
        cropSize
      );

      const cropData =
        cropCtx.getImageData(
          0,
          0,
          cropSize,
          cropSize
        );

      code =
        jsQR(
          cropData.data,
          cropData.width,
          cropData.height,
          {
            inversionAttempts:
              "attemptBoth"
          }
        );
    }

    if (!code || !code.data) {
      throw new Error(
        "No QR code was found in that image. Please select a clear saved QR image."
      );
    }

    const qrText =
      String(code.data).trim();

    const qrId =
      extractXOQrId(qrText);

    if (!qrId) {
      throw new Error(
        "This is not a valid XO+ QR code. The QR must contain an XO ID such as XO-0001."
      );
    }

    result.innerHTML =
      '<div class="checking">' +
      '⏳ Checking attendance...' +
      '<br><br><small>' +
      escapeHtml(qrId) +
      '</small></div>';

    sendAttendance(qrId);

  } catch (error) {

    console.error(
      "Uploaded QR error:",
      error
    );

    result.innerHTML =
      '<div class="error">' +
      '❌ Unable to read QR code' +
      '<br><br><small>' +
      escapeHtml(
        error.message ||
        "Please select a clear QR code image."
      ) +
      '</small></div>';

    processingQR = false;

    setTimeout(function() {
      scanning = true;
    }, 3000);

  } finally {

    uploadButton.disabled = false;

    // Allows selecting the same image again.
    qrFileInput.value = "";
  }
}


/*
====================================================
LOAD IMAGE FILE
====================================================
*/

function loadImageFromFile(file) {

  return new Promise(function(resolve, reject) {

    const url = URL.createObjectURL(file);
    const image = new Image();

    image.onload = function() {
      URL.revokeObjectURL(url);
      resolve(image);
    };

    image.onerror = function() {
      URL.revokeObjectURL(url);
      reject(
        new Error("The uploaded image could not be opened.")
      );
    };

    image.src = url;
  });
}


/*
====================================================
EXTRACT XO QR ID
====================================================
*/

function extractXOQrId(value) {

  const text = String(value || "").trim();
  const match = text.match(/XO-\d{1,8}/i);

  return match
    ? match[0].toUpperCase()
    : null;
}


/*
====================================================
STOP CAMERA
====================================================
*/

function stopCamera() {

  scanning = false;


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );

    stream = null;

  }


  video.srcObject = null;


  status.textContent =
    "Camera stopped.";

}


/*
====================================================
ESCAPE HTML
====================================================
*/

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value == null
      ? ""
      : value;

  return div.innerHTML;

}


/*
====================================================
BUTTONS
====================================================
*/

startButton.addEventListener(
  "click",
  startCamera
);


stopButton.addEventListener(
  "click",
  stopCamera
);

uploadButton.addEventListener(
  "click",
  function() {
    qrFileInput.click();
  }
);

qrFileInput.addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files &&
      event.target.files[0];

    uploadQRCode(file);
  }
);


</script>
